services:
  postgres:
    image: postgres:17
    container_name: finemp-postgres
    environment:
      POSTGRES_DB: finemp
      POSTGRES_USER: finemp
      POSTGRES_PASSWORD: finemp_local
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - finemp-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finemp -d finemp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  finemp-postgres-data:
  