    put:
      tags: [Identity administration]
      operationId: replacePlatformPermissions
      summary: Substitui explicitamente permissões de plataforma, sem conceder grants financeiros.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissions]
              properties:
                permissions:
                  type: array
                  uniqueItems: true
                  items: {$ref: '#/components/schemas/PlatformPermission'}
      responses:
        '204': {description: Permissões atualizadas, ou já iguais; alteração real é auditada.}
        '400': {description: Payload inválido.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Tentativa de remover o último administrador ativo.}
  /api/auth/organization-access:
    get:
      tags: [Authentication]
      operationId: getCurrentOrganizationAccess
