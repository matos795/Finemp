    AccountingSourcePage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/AccountingSource'}}
    InviteFirmUserRequest:
      type: object
      required: [name, email, permissions]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 255
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [HIERARCHY_MANAGE, USER_ACCESS_MANAGE, ACCOUNTING_SOURCE_MANAGE, CONNECTOR_MANAGE]
    CsrfToken:
      type: object
      required: [headerName, token]
      properties:
        headerName:
          type: string
          examples: [X-CSRF-TOKEN]
        token:
          type: string
          description: Valor opaco.
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          examples: [usuario@exemplo.invalid]
        password:
          type: string
          format: password
          writeOnly: true
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
    CompleteAccountActionRequest:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          writeOnly: true
          description: Segredo do fragmento do link; nunca registrar em logs ou telemetria.
        newPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          writeOnly: true
          description: Exige letra ASCII, dígito e no máximo 72 bytes UTF-8.
    CurrentUser:
      type: object
      required: [id, name, email, companies]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        companies:
          type: array
          items:
            $ref: '#/components/schemas/CurrentUserCompanyAccess'
    CurrentUserCompanyAccess:
      type: object
      required: [id, name, role, permissions, costCenterScope]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          $ref: '#/components/schemas/CompanyAccessRole'
        permissions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/CompanyPermission'
        costCenterScope:
          $ref: '#/components/schemas/CostCenterScope'
    AccountingMovement:
      type: object
      required:
        - id
        - accountingDate
        - accountDescription
        - accountKey
        - side
        - amount
        - history
        - sourceEntryKey
      properties:
        id:
          type: string
          format: uuid
        accountingDate:
          type: string
          format: date
        accountDescription:
          type: string
        accountKey:
          type: string
          description: Código da conta dentro da respectiva fonte/empresa; não é global.
        side:
          type: string
          enum: [DEBIT, CREDIT]
        amount:
          $ref: '#/components/schemas/DecimalAmount'
        history:
          type: [string, 'null']
        sourceEntryKey:
          type: string
    AccountingAccountClassification:
      type: object
      required:
        - accountId
        - accountingSourceId
        - accountKey
        - description
        - status
      properties:
        accountId:
          type: string
          format: uuid
        accountingSourceId:
          type: string
          format: uuid
        accountKey:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [PENDING, CLASSIFIED]
        classificationId:
          type: [string, 'null']
          format: uuid
        dreClassification:
          type: [string, 'null']
        dreOpenClassification:
          type: [string, 'null']
        ebitdaClassification:
          type: [string, 'null']
    AccountingAccountClassificationRequest:
      type: object
      additionalProperties: false
      required: [classificationId]
      properties:
        classificationId:
          type: string
          format: uuid
    DreClassification:
      type: object
      required: [id, dreClassification, dreOpenClassification, ebitdaClassification]
      properties:
        id:
          type: string
          format: uuid
        dreClassification:
          type: string
        dreOpenClassification:
          type: string
        ebitdaClassification:
          type: string
    DreCalculation:
      type: object
      required: [lines, unclassifiedAccountCount]
      properties:
        lines:
          type: array
          items:
            $ref: '#/components/schemas/DreLine'
        unclassifiedAccountCount:
          type: integer
          format: int32
          minimum: 0
    DreLine:
      type: object
      required: [dreClassification, dreOpenClassification, ebitdaClassification, total]
      properties:
        dreClassification:
          type: string
        dreOpenClassification:
          type: string
        ebitdaClassification:
          type: string
        total:
          $ref: '#/components/schemas/DecimalAmount'
    NonNegativeCentAmount:
      type: string
      pattern: '^[0-9]+[.][0-9]{2}$'
      maxLength: 20
      description: Decimal canônico não negativo em duas casas, preservado como string.
      examples: ['0.00', '210.50']
    FinancialEntryReadStatus:
      type: string
      enum: [OPEN, PAID, OVERDUE]
    PositiveCanonicalCentAmount:
      type: string
      maxLength: 20
      pattern: '^[0-9]{1,17}(\.[0-9]{1,2})?$'
      not: {pattern: '^0+(\.0{1,2})?$'}
      description: Maior que zero, decimal textual sem expoente, sinal negativo ou arredondamento implícito. Persistido com duas casas.
      examples: ['123.45']
    FinancialEntrySettlementCommand:
      type: object
      additionalProperties: false
      required: [values, expectedVersion]
      properties:
        expectedVersion: {type: integer, format: int64, minimum: 0}
        values:
          type: object
          additionalProperties: false
          required: [paymentDate, paidAmount, bankAccountId]
          properties:
            paymentDate: {type: string, format: date, description: Data ISO entre anos0001 e9999.}
            paidAmount: {$ref: '#/components/schemas/PositiveCanonicalCentAmount'}
            bankAccountId: {type: string, format: uuid, description: Conta da mesma Empresa; sem veto universal por inatividade.}
    FinancialEntrySettlementReversalCommand:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: {type: integer, format: int64, minimum: 0}
    MonthlyEntryCreateCommand:
      type: object
      additionalProperties: false
      required: [values, quantity]
      properties:
        values: {$ref: '#/components/schemas/FinancialEntryCommandValues'}
        quantity: {type: integer, minimum: 2, maximum: 120}
    EntrySeriesCommandReceipt:
      type: object
      required: [companyId, commandId, seriesId, items]
      properties:
        companyId: {type: string, format: uuid}
        commandId: {type: string, format: uuid}
        seriesId: {type: string, format: uuid}
        items:
          type: array
          minItems: 2
          maxItems: 120
          description: Ordem original de geração; não representa estado atual após alterações/exclusões.
          items:
            type: object
            required: [number, entryId, version]
            properties:
              number: {type: integer, minimum: 1, maximum: 120}
              entryId: {type: string, format: uuid}
              version: {type: integer, format: int64, minimum: 0}
    FinancialEntrySeriesInfo:
      type: object
      required: [id, mode, number, quantity]
      properties:
        id: {type: string, format: uuid}
        mode: {type: string, enum: [MONTHLY, INSTALLMENTS], description: Metadado original; não implica geração INSTALLMENTS habilitada.}
        number: {type: integer, minimum: 1, maximum: 120}
        quantity: {type: integer, minimum: 2, maximum: 120, description: Quantidade original, não a restante.}
    FinancialEntryCreateCommand:
      type: object
      additionalProperties: false
      required: [values]
      properties:
        values: {$ref: '#/components/schemas/FinancialEntryCommandValues'}
        expectedVersion: {type: 'null', description: Ausente ou null na criação.}
    FinancialEntryUpdateCommand:
      type: object
      additionalProperties: false
      required: [values, expectedVersion]
      properties:
        values: {$ref: '#/components/schemas/FinancialEntryCommandValues'}
        expectedVersion: {type: integer, format: int64, minimum: 0}
    FinancialEntryCommandValues:
      type: object
      additionalProperties: false
      required: [direction, description, nominalAmount, documentDate, entryDate, competence, dueDate, bankAccountId, categoryId]
      description: Dados canônicos individuais; texto monetário positivo exato. Não inclui ator, Empresa ou actualPaidAmount. Subcategoria e referências são validadas no servidor. Datas e competência entre anos0001 e9999. Campos inesperados, chaves duplicadas, NUL ou surrogates inválidos são rejeitados.
      properties:
        direction: {$ref: '#/components/schemas/FinancialDirection'}
        description: {type: string, minLength: 2, maxLength: 255}
        nominalAmount: {$ref: '#/components/schemas/PositiveCanonicalCentAmount'}
        documentDate: {type: string, format: date}
        entryDate: {type: string, format: date}
        competence: {type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'}
        dueDate: {type: string, format: date}
        paymentDate: {type: [string, 'null'], format: date}
        bankAccountId: {type: string, format: uuid}
        categoryId: {type: string, format: uuid}
        partnerId: {type: [string, 'null'], format: uuid}
        resultCenterId: {type: [string, 'null'], format: uuid}
        costBehaviorOverride:
          anyOf:
            - $ref: '#/components/schemas/CostBehavior'
            - type: 'null'
        paymentMethod: {type: [string, 'null'], maxLength: 80}
        documentNumber: {type: [string, 'null'], maxLength: 255}
        notes: {type: [string, 'null'], maxLength: 4000}
    FinancialEntryCommandReceipt:
      type: object
      required: [companyId, commandId, entryId, action, version]
      properties:
        companyId: {type: string, format: uuid}
        commandId: {type: string, format: uuid}
        entryId: {type: string, format: uuid}
        action: {type: string, enum: [CREATED, UPDATED, SETTLED, SETTLEMENT_REVERSED, DELETED]}
        version: {type: integer, format: int64, minimum: 0, description: Versão resultante do comando original; para DELETED é a última versão persistida. Não afirma o estado atual.}
        deletedEntries:
          type: array
          minItems: 1
          maxItems: 120
          description: Presente em DELETED. Raiz primeiro, depois ocorrências relacionadas por posição original; lista imutável do comando, não consulta atual.
          items: {$ref: '#/components/schemas/DeletedFinancialEntry'}
    DeletedFinancialEntry:
      type: object
      required: [entryId, version]
      properties:
        entryId: {type: string, format: uuid}
        version: {type: integer, format: int64, minimum: 0}
    FinancialEntryCommandRejection:
      type: object
      required: [code]
      properties:
        code:
          type: string
          enum: [INVALID_FINANCIAL_ENTRY_COMMAND, FINANCIAL_ENTRY_ACCESS_DENIED, FINANCIAL_ENTRY_NOT_FOUND, STALE_VERSION, IDEMPOTENCY_MISMATCH, TRANSACTION_NOT_SUPPORTED, FINANCIAL_ENTRY_CONFLICT, FINANCIAL_ENTRY_PAYLOAD_TOO_LARGE, FINANCIAL_ENTRY_UNSUPPORTED_ENCODING, FINANCIAL_ENTRY_BUSY, FINANCIAL_ENTRY_COMMAND_UNAVAILABLE]
        status: {type: integer}
        detail: {type: string, description: Mensagem fixa; sem conteúdo financeiro ou diagnóstico SQL.}
    FinancialEntryValues:
      type: object
      required: [direction, description, nominalAmount, documentDate, entryDate, competence, dueDate, bankAccountId, categoryId, paymentMethod, documentNumber, notes]
      properties:
        direction: {$ref: '#/components/schemas/FinancialDirection'}
        description: {type: string, minLength: 2, maxLength: 255}
        nominalAmount: {$ref: '#/components/schemas/NonNegativeCentAmount'}
        documentDate: {type: string, format: date}
        entryDate: {type: string, format: date}
        competence: {type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$', examples: ['2026-06']}
        dueDate: {type: string, format: date}
        paymentDate: {type: [string, 'null'], format: date}
        actualPaidAmount:
          anyOf:
            - $ref: '#/components/schemas/NonNegativeCentAmount'
            - type: 'null'
        bankAccountId: {type: string, format: uuid}
        categoryId: {type: string, format: uuid}
        partnerId: {type: [string, 'null'], format: uuid}
        resultCenterId: {type: [string, 'null'], format: uuid}
        costBehaviorOverride:
          anyOf:
            - $ref: '#/components/schemas/CostBehavior'
            - type: 'null'
        paymentMethod: {type: string, maxLength: 80}
        documentNumber: {type: string, maxLength: 255}
        notes: {type: string, maxLength: 4000}
    FinancialEntryRead:
      type: object
      required: [id, companyId, values, labels, effectiveCostBehavior, effectiveAmount, status, asOfDate, createdAt, updatedAt, version]
      properties:
        id: {type: string, format: uuid}
        companyId: {type: string, format: uuid}
        values: {$ref: '#/components/schemas/FinancialEntryValues'}
        series: {$ref: '#/components/schemas/FinancialEntrySeriesInfo'}
        labels:
          type: object
          properties:
            bankName: {type: string}
            categoryCode: {type: string}
            categoryName: {type: string}
            partnerName: {type: string, description: Rótulo financeiro; sem documento ou perfil completo.}
            centerCode: {type: string}
            centerName: {type: string}
        effectiveCostBehavior: {$ref: '#/components/schemas/CostBehavior'}
        effectiveAmount: {$ref: '#/components/schemas/NonNegativeCentAmount'}
        status: {$ref: '#/components/schemas/FinancialEntryReadStatus'}
        asOfDate: {type: string, format: date}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        version: {type: integer, format: int64, minimum: 0}
    FinancialEntryPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: {$ref: '#/components/schemas/FinancialEntryRead'}
    BankTransferCreateCommand:
      type: object
      additionalProperties: false
      required: [values]
      properties:
        values:
          type: object
          additionalProperties: false
          required: [originBankAccountId, destinationBankAccountId, transferDate, amount]
          properties:
            originBankAccountId: {type: string, format: uuid}
            destinationBankAccountId: {type: string, format: uuid, description: Deve diferir da origem e pertencer à mesma Empresa.}
            transferDate: {type: string, format: date, description: Data ISO canônica entre anos1 e9999.}
            amount: {$ref: '#/components/schemas/PositiveCanonicalCentAmount'}
            description: {type: [string, 'null'], maxLength: 255, description: Opcional; null ou ausência vira texto vazio. Normalizada sem NUL/UTF-16 inválido.}
    BankTransferCommandReceipt:
      type: object
      required: [companyId, commandId, transferId, action, version]
