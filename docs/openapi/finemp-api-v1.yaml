openapi: 3.1.0
info:
  title: FINEMP API
  version: 0.1.0
  summary: Contrato headless inicial das operações implementadas no FINEMP.
  description: |
    Contrato da API já disponível. Cálculos e persistência de negócio pertencem
    ao backend. Os endpoints de reporting ainda não implementados não fazem
    parte deste documento.
servers:
  - url: http://localhost:8080
    description: Ambiente local
tags:
  - name: Authentication
  - name: Identity administration
  - name: SaaS administration
  - name: Accounting movements
  - name: Account classification
  - name: DRE
  - name: Accounting synchronization
paths:
  /api/admin/accounting-firms:
    get:
      tags: [SaaS administration]
      operationId: listAccountingFirms
      summary: Consulta contabilidades com ACCOUNTING_FIRM_VIEW na plataforma.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Página de contabilidades.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountingFirmPage'}
        '400': {description: Paginação inválida.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [SaaS administration]
      operationId: createAccountingFirm
      summary: Cadastra contabilidade com ACCOUNTING_FIRM_CREATE na plataforma.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NameRequest'}
      responses:
        '201':
          description: Contabilidade criada ativa, sem grants financeiros implícitos.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountingFirm'}
        '400': {description: Cadastro inválido.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: Cadastro conflitante.}
  /api/accounting-firms/{accountingFirmId}/clients:
    parameters:
      - $ref: '#/components/parameters/AccountingFirmId'
    get:
      tags: [SaaS administration]
      operationId: listClients
      summary: Lista clientes com HIERARCHY_MANAGE na contabilidade.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Página de clientes no escopo.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClientPage'}
        '400': {description: Paginação inválida.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [SaaS administration]
      operationId: createClient
      summary: Cria cliente na contabilidade autorizada.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NameRequest'}
      responses:
        '201':
          description: Cliente criado ativo.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Client'}
        '400': {description: Cadastro inválido.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Cadastro conflitante.}
  /api/accounting-firms/{accountingFirmId}/clients/{clientId}/companies:
    parameters:
      - $ref: '#/components/parameters/AccountingFirmId'
      - $ref: '#/components/parameters/ClientId'
    get:
      tags: [SaaS administration]
      operationId: listClientCompanies
      summary: Lista empresas com HIERARCHY_MANAGE e relação contabilidade/cliente válida.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Página de empresas do cliente.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CompanyPage'}
        '400': {description: Paginação inválida.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [SaaS administration]
      operationId: createClientCompany
      summary: Cria empresa obrigatoriamente vinculada ao cliente autorizado.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateCompanyRequest'}
      responses:
        '201':
          description: Empresa criada, sem concessão automática de acesso financeiro.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Company'}
        '400': {description: Cadastro inválido.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Cadastro conflitante.}
  /api/accounting-firms/{accountingFirmId}/clients/{clientId}/companies/{companyId}/assignment:
    parameters:
      - $ref: '#/components/parameters/AccountingFirmId'
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/CompanyId'
    put:
      tags: [SaaS administration]
      operationId: assignUnlinkedCompany
      summary: Associa empresa legada sem cliente, com autorização dupla e auditoria.
      description: Exige UNASSIGNED_COMPANY_ASSIGN global e HIERARCHY_MANAGE no destino. Mesmo destino é idempotente; outro destino é rejeitado.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: Empresa vinculada ao cliente solicitado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Company'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Empresa já vinculada a outro cliente.}
  /api/accounting-firms/{accountingFirmId}/clients/{clientId}/companies/{companyId}/accounting-sources:
    parameters:
      - $ref: '#/components/parameters/AccountingFirmId'
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [SaaS administration]
      operationId: listCompanyAccountingSources
      summary: Lista fontes com ACCOUNTING_SOURCE_MANAGE e relações pai/filho válidas.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Página de fontes; busca por referência externa, sem secrets.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountingSourcePage'}
        '400': {description: Paginação inválida.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [SaaS administration]
      operationId: createCompanyAccountingSource
      summary: Cria fonte sem receber configuração de conexão ou credenciais.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateAccountingSourceRequest'}
      responses:
        '201':
          description: Fonte criada ativa; tipo atualmente suportado QUESTOR.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountingSource'}
        '400': {description: Cadastro inválido.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Cadastro conflitante.}
  /api/admin/accounting-firms/{firmId}/invitations:
    post:
      tags: [Identity administration]
      operationId: inviteAccountingFirmUser
      summary: Convida ou vincula uma identidade à contabilidade autorizada.
      description: Requer entrega habilitada e USER_ACCESS_MANAGE nessa contabilidade. Permissões solicitadas são aditivas; não concede acesso financeiro.
      parameters:
        - name: firmId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteFirmUserRequest'
      responses:
        '204':
          description: Operação concluída, sem token/senha na resposta e sem revelar a existência global do e-mail.
        '400':
          description: Formato de requisição inválido.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Contabilidade não encontrada no escopo autorizado ou entrega desabilitada.
        '429':
          description: Limite temporário de convites desse administrador excedido.
  /api/auth/csrf:
    get:
      tags: [Authentication]
      operationId: getCsrfToken
      summary: Obtém o token CSRF para operações mutáveis.
      security: []
      responses:
        '200':
          description: Token CSRF atual.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
  /api/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Inicia uma sessão autenticada.
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '204':
          description: Sessão iniciada. O cookie de sessão é enviado pelo servidor.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          description: Limite temporário de tentativas de login excedido; não desativa a conta.
  /api/auth/password-reset/request:
    post:
      tags: [Authentication]
      operationId: requestPasswordReset
      summary: Solicita um link de recuperação sem revelar existência da conta.
      description: Disponível somente com finemp.identity.mail.enabled=true e transporte configurado.
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '202':
          description: Resposta vazia e neutra, inclusive para endereço desconhecido, inativo ou limitado.
        '400':
          description: Formato de requisição inválido.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Funcionalidade de entrega desabilitada.
  /api/auth/password-reset/complete:
    post:
      tags: [Authentication]
      operationId: completePasswordReset
      summary: Redefine a senha usando link de recuperação de uso único.
      description: Requer entrega habilitada. Não inicia sessão; invalida sessões anteriores.
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteAccountActionRequest'
      responses:
        '204':
          description: Senha alterada. Obter novo CSRF e fazer login novamente.
        '400':
          description: Link inválido, expirado, consumido ou senha incompatível; sem detalhes sobre o token.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Funcionalidade de entrega desabilitada.
        '429':
          description: Limite temporário de tentativas excedido.
  /api/auth/activate:
    post:
      tags: [Authentication]
      operationId: activateInvitedAccount
      summary: Ativa uma identidade convidada e define sua senha.
      description: Requer entrega habilitada. O link não concede permissões financeiras nem inicia sessão.
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteAccountActionRequest'
      responses:
        '204':
          description: Identidade ativada; obter novo CSRF e iniciar sessão.
        '400':
          description: Convite inválido, expirado, consumido ou senha incompatível.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Funcionalidade de entrega desabilitada.
        '429':
          description: Limite temporário de tentativas excedido.
  /api/auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      summary: Retorna o usuário autenticado e seus acessos por empresa.
      responses:
        '200':
          description: Usuário e grants acessíveis.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Encerra e invalida a sessão atual.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Sessão encerrada.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/companies/{companyId}/accounting-movements:
    get:
      tags: [Accounting movements]
      operationId: listAccountingMovements
      summary: Lista movimentos contábeis de uma empresa em um período.
      description: A resposta atual ainda não possui paginação server-side.
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
      responses:
        '200':
          description: Movimentos no período inclusivo.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountingMovement'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/companies/{companyId}/accounting-accounts/classifications:
    get:
      tags: [Account classification]
      operationId: listAccountingAccountClassifications
      summary: Lista contas da empresa e o estado da classificação gerencial.
      parameters:
        - $ref: '#/components/parameters/CompanyId'
      responses:
        '200':
          description: Contas pendentes e classificadas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountingAccountClassification'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/companies/{companyId}/accounting-accounts/{accountId}/classification:
    put:
      tags: [Account classification]
      operationId: classifyAccountingAccount
      summary: Classifica ou reclassifica uma conta da empresa.
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountingAccountClassificationRequest'
      responses:
        '204':
          description: Classificação aplicada.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/dre-classifications:
    get:
      tags: [Account classification]
      operationId: listDreClassifications
      summary: Lista o catálogo gerencial global de classificações DRE.
      responses:
        '200':
          description: Catálogo FINEMP.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DreClassification'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/companies/{companyId}/dre:
    get:
      tags: [DRE]
      operationId: calculateDre
      summary: Calcula a DRE inicial para a empresa e o período.
      description: Requer a permissão DRE_VIEW para a empresa solicitada.
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
      responses:
        '200':
          description: Linhas agregadas e quantidade de contas pendentes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DreCalculation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/accounting-sources/{accountingSourceId}/questor-import:
    post:
      tags: [Accounting synchronization]
      operationId: importQuestorAccountingMovements
      summary: Importa movimentos da fonte Questor para o FINEMP.
      description: |
        Operação administrativa disponível somente quando a integração Questor
        está habilitada. Não deve ser chamada durante uma leitura de tela.
      parameters:
        - name: accountingSourceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Importação concluída.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: Sessão HTTP mantida em cookie HttpOnly.
  parameters:
    AccountingFirmId:
      name: accountingFirmId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ClientId:
      name: clientId
      in: path
      required: true
      schema: {type: string, format: uuid}
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 0, default: 0}
    Size:
      name: size
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    Search:
      name: search
      in: query
      description: Busca textual por nome/razão social; nas fontes, referência externa. Vazia inclui todos os registros do escopo.
      schema: {type: string, default: ''}
    CompanyId:
      name: companyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StartDate:
      name: startDate
      in: query
      required: true
      schema:
        type: string
        format: date
    EndDate:
      name: endDate
      in: query
      required: true
      schema:
        type: string
        format: date
    CsrfHeader:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: Valor obtido em `GET /api/auth/csrf`; o nome efetivo também é retornado pela API.
      schema:
        type: string
  responses:
    BadRequest:
      description: Requisição inválida.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthorized:
      description: Sessão ausente, expirada ou credenciais inválidas.
    Forbidden:
      description: Usuário autenticado sem grant, permission, data scope ou token CSRF válido.
    NotFound:
      description: Recurso não encontrado dentro do escopo autorizado.
  schemas:
    NameRequest:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
    CreateCompanyRequest:
      type: object
      required: [legalName, cnpj]
      properties:
        legalName: {type: string, minLength: 1, maxLength: 255}
        cnpj: {type: string, pattern: '^[0-9]{14}$'}
    CreateAccountingSourceRequest:
      type: object
      required: [type]
      properties:
        type: {type: string, enum: [QUESTOR]}
        externalReference: {type: [string, 'null'], maxLength: 255}
    AccountingFirm:
      type: object
      required: [id, name, active]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        active: {type: boolean}
    Client:
      type: object
      required: [id, accountingFirmId, name, active]
      properties:
        id: {type: string, format: uuid}
        accountingFirmId: {type: string, format: uuid}
        name: {type: string}
        active: {type: boolean}
    Company:
      type: object
      required: [id, clientId, legalName, cnpj]
      properties:
        id: {type: string, format: uuid}
        clientId: {type: string, format: uuid}
        legalName: {type: string}
        cnpj: {type: string, pattern: '^[0-9]{14}$'}
    AccountingSource:
      type: object
      required: [id, companyId, type, externalReference, active]
      properties:
        id: {type: string, format: uuid}
        companyId: {type: string, format: uuid}
        type: {type: string, enum: [QUESTOR]}
        externalReference: {type: [string, 'null']}
        active: {type: boolean}
    PageMetadata:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1, maximum: 100}
        totalItems: {type: integer, format: int64, minimum: 0}
        totalPages: {type: integer, minimum: 0}
    AccountingFirmPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/AccountingFirm'}}
    ClientPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/Client'}}
    CompanyPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/Company'}}
    AccountingSourcePage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/AccountingSource'}}
    InviteFirmUserRequest:
      type: object
      required: [name, email, permissions]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 255
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [HIERARCHY_MANAGE, USER_ACCESS_MANAGE, ACCOUNTING_SOURCE_MANAGE, CONNECTOR_MANAGE]
    CsrfToken:
      type: object
      required: [headerName, token]
      properties:
        headerName:
          type: string
          examples: [X-CSRF-TOKEN]
        token:
          type: string
          description: Valor opaco.
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          examples: [usuario@exemplo.invalid]
        password:
          type: string
          format: password
          writeOnly: true
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
    CompleteAccountActionRequest:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          writeOnly: true
          description: Segredo do fragmento do link; nunca registrar em logs ou telemetria.
        newPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          writeOnly: true
          description: Exige letra ASCII, dígito e no máximo 72 bytes UTF-8.
    CurrentUser:
      type: object
      required: [id, name, email, companies]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        companies:
          type: array
          items:
            $ref: '#/components/schemas/CurrentUserCompanyAccess'
    CurrentUserCompanyAccess:
      type: object
      required: [id, name, role, permissions, costCenterScope]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          $ref: '#/components/schemas/CompanyAccessRole'
        permissions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/CompanyPermission'
        costCenterScope:
          $ref: '#/components/schemas/CostCenterScope'
    AccountingMovement:
      type: object
      required:
        - id
        - accountingDate
        - accountDescription
        - accountKey
        - side
        - amount
        - history
        - sourceEntryKey
      properties:
        id:
          type: string
          format: uuid
        accountingDate:
          type: string
          format: date
        accountDescription:
          type: string
        accountKey:
          type: string
          description: Código da conta dentro da respectiva fonte/empresa; não é global.
        side:
          type: string
          enum: [DEBIT, CREDIT]
        amount:
          $ref: '#/components/schemas/DecimalAmount'
        history:
          type: [string, 'null']
        sourceEntryKey:
          type: string
    AccountingAccountClassification:
      type: object
      required:
        - accountId
        - accountingSourceId
        - accountKey
        - description
        - status
      properties:
        accountId:
          type: string
          format: uuid
        accountingSourceId:
          type: string
          format: uuid
        accountKey:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [PENDING, CLASSIFIED]
        classificationId:
          type: [string, 'null']
          format: uuid
        dreClassification:
          type: [string, 'null']
        dreOpenClassification:
          type: [string, 'null']
        ebitdaClassification:
          type: [string, 'null']
    AccountingAccountClassificationRequest:
      type: object
      additionalProperties: false
      required: [classificationId]
      properties:
        classificationId:
          type: string
          format: uuid
    DreClassification:
      type: object
      required: [id, dreClassification, dreOpenClassification, ebitdaClassification]
      properties:
        id:
          type: string
          format: uuid
        dreClassification:
          type: string
        dreOpenClassification:
          type: string
        ebitdaClassification:
          type: string
    DreCalculation:
      type: object
      required: [lines, unclassifiedAccountCount]
      properties:
        lines:
          type: array
          items:
            $ref: '#/components/schemas/DreLine'
        unclassifiedAccountCount:
          type: integer
          format: int32
          minimum: 0
    DreLine:
      type: object
      required: [dreClassification, dreOpenClassification, ebitdaClassification, total]
      properties:
        dreClassification:
          type: string
        dreOpenClassification:
          type: string
        ebitdaClassification:
          type: string
        total:
          $ref: '#/components/schemas/DecimalAmount'
    DecimalAmount:
      type: number
      description: Decimal calculado em BigDecimal no backend. O consumidor apenas formata.
      examples: [1250.50]
    CompanyAccessRole:
      type: string
      enum: [CUSTOM, ADMIN, ACCOUNTANT, CLIENT, VIEWER]
    CompanyPermission:
      type: string
      enum:
        - DASHBOARD_VIEW
        - DRE_VIEW
        - BALANCE_SHEET_VIEW
        - CASH_FLOW_VIEW
        - INDICATORS_VIEW
        - ACCOUNT_CLASSIFICATION_MANAGE
        - MANUAL_ENTRY_MANAGE
        - QUESTOR_SYNC
    CostCenterScope:
      type: string
      enum: [ALL, RESTRICTED]
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
security:
  - SessionCookie: []

