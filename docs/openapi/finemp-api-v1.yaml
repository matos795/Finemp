      properties:
        id: {type: string, format: uuid}
        companyId: {type: string, format: uuid}
        originBankAccountId: {type: string, format: uuid}
        originBankAccountName: {type: string}
        destinationBankAccountId: {type: string, format: uuid}
        destinationBankAccountName: {type: string}
        transferDate: {type: string, format: date}
        amount: {$ref: '#/components/schemas/NonNegativeCentAmount'}
        description: {type: string, maxLength: 255}
        version: {type: integer, format: int64, minimum: 0}
    BankTransferPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: {$ref: '#/components/schemas/BankTransferRead'}
    FinancialDirection:
