          maxLength: 40
        treatment:
          type: string
          enum:
            - PAYABLE
            - RECOVERABLE
        amount:
          type: string
          pattern: ^[0-9]{1,17}([.][0-9]{1,2})?$
        documentReference:
          type:
            - string
            - 'null'
          maxLength: 255
    WithholdingValues:
