        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [SaaS administration]
      operationId: createCompanyAccountingSource
      summary: Cria fonte sem receber configuração de conexão ou credenciais.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateAccountingSourceRequest'}
      responses:
        '201':
          description: Fonte criada ativa; tipo atualmente suportado QUESTOR.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountingSource'}
        '400': {description: Cadastro inválido.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Cadastro conflitante.}
  /api/admin/accounting-firms/{firmId}/invitations:
    post:
      tags: [Identity administration]
      operationId: inviteAccountingFirmUser
      summary: Convida ou vincula uma identidade à contabilidade autorizada.
      description: Requer entrega habilitada e USER_ACCESS_MANAGE nessa contabilidade. Permissões solicitadas são aditivas; não concede acesso financeiro.
      parameters:
        - name: firmId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteFirmUserRequest'
      responses:
        '204':
          description: Operação concluída, sem token/senha na resposta e sem revelar a existência global do e-mail.
        '400':
          description: Formato de requisição inválido.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Contabilidade não encontrada no escopo autorizado ou entrega desabilitada.
        '429':
          description: Limite temporário de convites desse administrador excedido.
  /api/auth/csrf:
    get:
      tags: [Authentication]
      operationId: getCsrfToken
      summary: Obtém o token CSRF para operações mutáveis.
      security: []
      responses:
        '200':
          description: Token CSRF atual.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
  /api/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Inicia uma sessão autenticada.
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '204':
          description: Sessão iniciada. O cookie de sessão é enviado pelo servidor.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          description: Limite temporário de tentativas de login excedido; não desativa a conta.
  /api/auth/password-reset/request:
    post:
      tags: [Authentication]
      operationId: requestPasswordReset
      summary: Solicita um link de recuperação sem revelar existência da conta.
      description: Disponível somente com finemp.identity.mail.enabled=true e transporte configurado.
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '202':
          description: Resposta vazia e neutra, inclusive para endereço desconhecido, inativo ou limitado.
        '400':
          description: Formato de requisição inválido.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Funcionalidade de entrega desabilitada.
  /api/auth/password-reset/complete:
    post:
      tags: [Authentication]
      operationId: completePasswordReset
      summary: Redefine a senha usando link de recuperação de uso único.
      description: Requer entrega habilitada. Não inicia sessão; invalida sessões anteriores.
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteAccountActionRequest'
      responses:
        '204':
          description: Senha alterada. Obter novo CSRF e fazer login novamente.
        '400':
          description: Link inválido, expirado, consumido ou senha incompatível; sem detalhes sobre o token.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Funcionalidade de entrega desabilitada.
        '429':
          description: Limite temporário de tentativas excedido.
  /api/auth/activate:
    post:
      tags: [Authentication]
      operationId: activateInvitedAccount
      summary: Ativa uma identidade convidada e define sua senha.
      description: Requer entrega habilitada. O link não concede permissões financeiras nem inicia sessão.
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteAccountActionRequest'
      responses:
        '204':
          description: Identidade ativada; obter novo CSRF e iniciar sessão.
        '400':
          description: Convite inválido, expirado, consumido ou senha incompatível.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Funcionalidade de entrega desabilitada.
        '429':
          description: Limite temporário de tentativas excedido.
  /api/auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      summary: Retorna o usuário autenticado e seus acessos por empresa.
      responses:
        '200':
          description: Usuário e grants acessíveis.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Encerra e invalida a sessão atual.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Sessão encerrada.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/companies/{companyId}/accounting-movements:
    get:
      tags: [Accounting movements]
      operationId: listAccountingMovements
      summary: Lista movimentos contábeis de uma empresa em um período.
      description: Exige ACCOUNTING_MOVEMENT_VIEW e escopo ALL. DRE_VIEW não autoriza o razão bruto. A resposta atual ainda não possui paginação server-side.
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
      responses:
        '200':
          description: Movimentos no período inclusivo.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountingMovement'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/companies/{companyId}/accounting-accounts/classifications:
    get:
      tags: [Account classification]
      operationId: listAccountingAccountClassifications
      summary: Lista contas da empresa e o estado da classificação gerencial.
      description: Exige ACCOUNT_CLASSIFICATION_VIEW ou ACCOUNT_CLASSIFICATION_MANAGE na empresa e escopo ALL.
      parameters:
        - $ref: '#/components/parameters/CompanyId'
      responses:
        '200':
          description: Contas pendentes e classificadas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountingAccountClassification'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/companies/{companyId}/accounting-accounts/{accountId}/classification:
    put:
      tags: [Account classification]
      operationId: classifyAccountingAccount
      summary: Classifica ou reclassifica uma conta da empresa.
      description: Exige ACCOUNT_CLASSIFICATION_MANAGE na empresa e escopo de dados suportado; grant genérico não autoriza escrita.
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountingAccountClassificationRequest'
      responses:
        '204':
          description: Classificação aplicada.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/dre-classifications:
    get:
      tags: [Account classification]
      operationId: listDreClassifications
      summary: Lista o catálogo gerencial global de classificações DRE.
      responses:
        '200':
          description: Catálogo FINEMP.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DreClassification'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/companies/{companyId}/dre:
    get:
      tags: [DRE]
      operationId: calculateDre
      summary: Calcula a DRE inicial para a empresa e o período.
      description: Requer a permissão DRE_VIEW para a empresa solicitada.
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
      responses:
        '200':
          description: Linhas agregadas e quantidade de contas pendentes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DreCalculation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/accounting-sources/{accountingSourceId}/questor-import:
    post:
      tags: [Accounting synchronization]
      operationId: importQuestorAccountingMovements
      summary: Importa movimentos da fonte Questor para o FINEMP.
      description: |
        Operação administrativa disponível somente quando a integração Questor
        está habilitada. Não deve ser chamada durante uma leitura de tela.
        É desativada quando FINEMP_SYNC_EXECUTOR_ENABLED está habilitado;
        nesse modo, usar o controle SyncRun.
        O caminho legado de estudo não é publicado no perfil prod.
        Exige QUESTOR_SYNC na empresa proprietária da fonte, resolvida pelo servidor,
        e escopo ALL enquanto não houver segmentação de centro de custo.
        Valida fonte ativa, referência e período antes do adapter.
        CNPJ esperado não substitui comprovação da identidade externa;
        gate de produção multi-tenant ainda aberto.
      parameters:
        - name: accountingSourceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Importação concluída.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409': {description: Fonte inativa ou incompatível.}
        '502': {description: Leitura externa indisponível; dados anteriores preservados.}
        '422': {description: RESOURCE_LIMIT; solicitar período menor, sem resultado truncado.}
components:
  securitySchemes:
    ConnectorBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Segredo de máquina restrito a uma fonte, enviado somente via HTTPS em Authorization. Não é JWT nem credencial ERP.
    SessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: Sessão HTTP mantida em cookie HttpOnly.
  parameters:
    AccountingSourceId:
      name: accountingSourceId
      in: path
      required: true
      schema: {type: string, format: uuid}
    SyncRunId:
      name: runId
      in: path
      required: true
      schema: {type: string, format: uuid}
    UserId:
      name: userId
      in: path
      required: true
      schema: {type: string, format: uuid}
    AccountingFirmId:
      name: accountingFirmId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ClientId:
      name: clientId
      in: path
      required: true
      schema: {type: string, format: uuid}
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 0, default: 0}
    Size:
      name: size
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    Search:
      name: search
      in: query
      description: Busca textual por nome/razão social; nas fontes, referência externa; nas identidades, nome ou e-mail. Vazia inclui todos os registros do escopo.
      schema: {type: string, default: ''}
    CompanyId:
      name: companyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StartDate:
      name: startDate
      in: query
      required: true
      schema:
        type: string
        format: date
    EndDate:
      name: endDate
      in: query
      required: true
      schema:
        type: string
        format: date
    CsrfHeader:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: Valor obtido em `GET /api/auth/csrf`; o nome efetivo também é retornado pela API.
      schema:
        type: string
  responses:
    BadRequest:
      description: Requisição inválida.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthorized:
      description: Sessão ausente, expirada ou credenciais inválidas.
    Forbidden:
      description: Usuário autenticado sem grant, permission, data scope ou token CSRF válido.
    NotFound:
      description: Recurso não encontrado dentro do escopo autorizado.
  schemas:
    PlatformPermission:
      type: string
      enum: [ACCOUNTING_FIRM_CREATE, ACCOUNTING_FIRM_VIEW, UNASSIGNED_COMPANY_ASSIGN, PLATFORM_USER_MANAGE]
    SyncRunStatus:
      type: string
      enum: [REQUESTED, RUNNING, SUCCEEDED, FAILED, CANCELLED]
    SyncRunMode:
      type: string
      enum: [INITIAL, INCREMENTAL, RECONCILIATION]
      description: Intenção explícita; não implica cursor ou retificação já implementados.
    RequestSyncRun:
      type: object
      required: [mode, startDate, endDate]
      properties:
        mode: {$ref: '#/components/schemas/SyncRunMode'}
        startDate: {type: string, format: date}
        endDate:
          type: string
          format: date
          description: Inclusiva, não anterior ao início; janela configurável, padrão 366 dias por solicitação nova.
    SyncRun:
      type: object
      required: [id, accountingSourceId, requestedByUserId, mode, status, startDate, endDate, requestedAt, startedAt, finishedAt, readCount, importedCount, skippedCount, failureCode]
      properties:
        id: {type: string, format: uuid}
        accountingSourceId: {type: string, format: uuid}
        requestedByUserId: {type: string, format: uuid}
        mode: {$ref: '#/components/schemas/SyncRunMode'}
        status: {$ref: '#/components/schemas/SyncRunStatus'}
        startDate: {type: string, format: date}
        endDate: {type: string, format: date}
        requestedAt: {type: string, format: date-time}
        startedAt: {type: [string, 'null'], format: date-time}
        finishedAt: {type: [string, 'null'], format: date-time}
        readCount: {type: [integer, 'null'], format: int64, minimum: 0}
        importedCount: {type: [integer, 'null'], format: int64, minimum: 0}
        skippedCount: {type: [integer, 'null'], format: int64, minimum: 0}
        failureCode:
          type: [string, 'null']
          enum: [READ_FAILED, IDENTITY_MISMATCH, INVALID_PAYLOAD, PUBLICATION_FAILED, LEASE_EXPIRED, RETRY_LIMIT, SOURCE_NOT_AVAILABLE, ACCESS_REVOKED, UNSUPPORTED_MODE, DATA_CONFLICT, RESOURCE_LIMIT, null]
    SyncFailureCode:
      type: [string, 'null']
      enum: [READ_FAILED, IDENTITY_MISMATCH, INVALID_PAYLOAD, PUBLICATION_FAILED, LEASE_EXPIRED, RETRY_LIMIT, SOURCE_NOT_AVAILABLE, ACCESS_REVOKED, UNSUPPORTED_MODE, DATA_CONFLICT, RESOURCE_LIMIT, null]
    SyncRunPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          properties:
            items:
              type: array
              items: {$ref: '#/components/schemas/SyncRun'}
    SyncRunEvent:
      type: object
      required: [id, status, actorType, actorId, occurredAt, transitionIndex]
      properties:
        id: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/SyncRunStatus'}
        actorType: {type: string, enum: [USER, SYSTEM, CONNECTOR]}
        actorId: {type: [string, 'null'], format: uuid}
        occurredAt: {type: string, format: date-time}
        transitionIndex:
          type: integer
          minimum: 0
          maximum: 2
          description: Fase causal do ciclo geral, independente de empates no timestamp UTC.
    SyncRunEventPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          properties:
            items:
              type: array
              items: {$ref: '#/components/schemas/SyncRunEvent'}
    SyncAttempt:
      type: object
      required: [id, attemptNumber, status, startedAt, lastRenewedAt, leaseExpiresAt, finishedAt, nextAttemptAt, failureCode]
      properties:
        id: {type: string, format: uuid}
        attemptNumber: {type: integer, minimum: 1, maximum: 10}
        status: {type: string, enum: [RUNNING, SUCCEEDED, FAILED, EXPIRED]}
        startedAt: {type: string, format: date-time}
        lastRenewedAt: {type: string, format: date-time}
        leaseExpiresAt: {type: string, format: date-time}
        finishedAt: {type: [string, 'null'], format: date-time}
        nextAttemptAt: {type: [string, 'null'], format: date-time}
        failureCode: {$ref: '#/components/schemas/SyncFailureCode'}
    SyncAttemptPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          properties:
            items:
              type: array
              items: {$ref: '#/components/schemas/SyncAttempt'}
    ConnectorCredential:
      type: object
      required: [id, accountingFirmId, accountingSourceId, label, createdAt, expiresAt, revokedAt, version]
      properties:
        id: {type: string, format: uuid}
        accountingFirmId: {type: string, format: uuid}
        accountingSourceId: {type: string, format: uuid}
        label: {type: string}
        createdAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        revokedAt: {type: [string, 'null'], format: date-time}
        version: {type: integer, format: int64}
    ConnectorSecret:
      type: object
      required: [credential, secret]
      properties:
        credential: {$ref: '#/components/schemas/ConnectorCredential'}
        secret:
          type: string
          minLength: 43
          maxLength: 43
          description: Segredo opaco apresentado uma vez. Não registrar, compartilhar ou persistir no backend em texto puro.
    ConnectorCredentialPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          properties:
            items:
              type: array
              items: {$ref: '#/components/schemas/ConnectorCredential'}
    ConnectorBatch:
      type: object
      additionalProperties: false
      required: [observedIdentity, movements]
      properties:
        observedIdentity:
          type: object
          additionalProperties: false
          required: [externalReference, cnpj]
          properties:
            externalReference: {type: string, maxLength: 255}
            cnpj: {type: string, maxLength: 32}
        movements:
          type: array
          maxItems: 100000
          description: Limite efetivo configurado, padrão 25000; orçamento de bytes também se aplica. Nenhum truncamento.
          items:
            type: object
            additionalProperties: false
            required: [sourceEntryKey, accountingDate, externalAccountId, accountKey, accountDescription, side, amount]
            properties:
              sourceEntryKey: {type: string, minLength: 1, maxLength: 255}
              accountingDate: {type: string, format: date}
              externalAccountId: {type: string, minLength: 1, maxLength: 255}
              accountKey: {type: string, minLength: 1, maxLength: 255}
              accountDescription: {type: string, maxLength: 255}
              side: {type: string, enum: [DEBIT, CREDIT]}
              amount:
                type: [number, string]
                description: Decimal exato representável em NUMERIC(19,4); não arredondar nem inverter sinal por side. String decimal aceita até 64 caracteres.
              history: {type: [string, 'null'], maxLength: 255}
    ConnectorWorkResult:
      type: object
      required: [attemptId, runId, attemptNumber, currentAttempt, attemptStatus, runStatus, leaseExpiresAt, nextAttemptAt, attemptFailureCode, runFailureCode, readCount, importedCount, skippedCount]
      properties:
        attemptId: {type: string, format: uuid}
        runId: {type: string, format: uuid}
        attemptNumber: {type: integer}
        currentAttempt: {type: boolean}
        attemptStatus: {type: string, enum: [RUNNING, SUCCEEDED, FAILED, EXPIRED]}
        runStatus: {$ref: '#/components/schemas/SyncRunStatus'}
        leaseExpiresAt: {type: string, format: date-time}
        nextAttemptAt: {type: [string, 'null'], format: date-time}
        attemptFailureCode: {$ref: '#/components/schemas/SyncFailureCode'}
        runFailureCode: {$ref: '#/components/schemas/SyncFailureCode'}
        readCount: {type: [integer, 'null'], format: int64}
        importedCount: {type: [integer, 'null'], format: int64}
        skippedCount: {type: [integer, 'null'], format: int64}
    ConnectorWork:
      type: object
      required: [attemptId, runId, attemptNumber, mode, leaseExpiresAt, serverTime, context]
      properties:
        attemptId: {type: string, format: uuid}
        runId: {type: string, format: uuid}
        attemptNumber: {type: integer, minimum: 1, maximum: 10}
        mode: {type: string, enum: [INITIAL]}
        leaseExpiresAt: {type: string, format: date-time}
        serverTime: {type: string, format: date-time, description: Tempo do servidor para calcular duração restante sem assumir relógio local sincronizado.}
        context:
          type: object
          required: [accountingSourceId, companyId, sourceType, externalCompanyReference, expectedCompanyCnpj, startDate, endDate]
          properties:
            accountingSourceId: {type: string, format: uuid}
            companyId: {type: string, format: uuid}
            sourceType: {type: string, enum: [QUESTOR]}
            externalCompanyReference: {type: string}
            expectedCompanyCnpj: {type: string, pattern: '^[0-9]{14}$'}
            startDate: {type: string, format: date}
            endDate: {type: string, format: date}
    ConnectorLease:
      type: object
      required: [attemptId, leaseExpiresAt, serverTime]
      properties:
        attemptId: {type: string, format: uuid}
        leaseExpiresAt: {type: string, format: date-time}
        serverTime: {type: string, format: date-time}
    ConnectorMachineScope:
      type: object
      required: [credentialId, accountingFirmId, accountingSourceId, credentialVersion]
      properties:
        credentialId: {type: string, format: uuid}
        accountingFirmId: {type: string, format: uuid}
        accountingSourceId: {type: string, format: uuid}
        credentialVersion: {type: integer, format: int64, minimum: 0, description: 'Versão técnica inicial zero; não confundir com attemptNumber, que começa em um.'}
    ConnectorProtocolError:
      type: object
      required: [code]
      properties:
        code: {type: string, enum: [CONNECTOR_UNAUTHORIZED, CONNECTOR_RATE_LIMITED, CONNECTOR_UNAVAILABLE, CONNECTOR_WORK_NOT_FOUND, CONNECTOR_WORK_NOT_CURRENT, CONNECTOR_INVALID_REQUEST, CONNECTOR_PAYLOAD_TOO_LARGE, CONNECTOR_UNSUPPORTED_ENCODING, CONNECTOR_BUSY]}
    AccessCatalog:
      type: object
      required: [version, platformPermissions, accountingFirmPermissions, companyPermissions, companyScreenPresets]
      properties:
        version: {type: string}
        platformPermissions:
          type: array
          uniqueItems: true
          items: {$ref: '#/components/schemas/PlatformPermission'}
        accountingFirmPermissions:
          type: array
          uniqueItems: true
          items: {$ref: '#/components/schemas/AccountingFirmPermission'}
        companyPermissions:
          type: array
          uniqueItems: true
          items: {$ref: '#/components/schemas/CompanyPermission'}
        companyScreenPresets:
          type: array
          items:
            type: object
            required: [id, label, viewAvailable, editAvailable, viewPermissions, editPermissions, availabilityCondition]
            properties:
              id: {type: string}
              label: {type: string}
              viewAvailable: {type: boolean}
              editAvailable: {type: boolean}
              viewPermissions:
                type: array
                uniqueItems: true
                items: {$ref: '#/components/schemas/CompanyPermission'}
              editPermissions:
                type: array
                uniqueItems: true
                items: {$ref: '#/components/schemas/CompanyPermission'}
              availabilityCondition:
                type: [string, 'null']
                description: QUESTOR_INTEGRATION_ENABLED ou SYNC_CONTROL_ENABLED, conforme a configuração exigida pela operação.
    SetCompanyAccessRequest:
      type: object
      required: [role, costCenterScope, permissions]
      properties:
        role: {$ref: '#/components/schemas/CompanyAccessRole'}
        costCenterScope: {$ref: '#/components/schemas/CostCenterScope'}
        permissions:
          type: array
          uniqueItems: true
          items: {$ref: '#/components/schemas/CompanyPermission'}
    CompanyUserAccess:
      allOf:
        - $ref: '#/components/schemas/SetCompanyAccessRequest'
        - type: object
          required: [companyId, user]
          properties:
            companyId: {type: string, format: uuid}
            user: {$ref: '#/components/schemas/UserAdministrationSummary'}
    AccountingFirmPermission:
      type: string
      enum: [HIERARCHY_MANAGE, USER_ACCESS_MANAGE, ACCOUNTING_SOURCE_MANAGE, CONNECTOR_MANAGE]
    FirmUserAccess:
      type: object
      required: [accountingFirmId, user, permissions]
      properties:
        accountingFirmId: {type: string, format: uuid}
        user: {$ref: '#/components/schemas/UserAdministrationSummary'}
        permissions:
          type: array
          uniqueItems: true
          items: {$ref: '#/components/schemas/AccountingFirmPermission'}
    UserAdministrationSummary:
      type: object
      required: [id, name, email, active, invitationPending]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        email: {type: string, format: email}
        active: {type: boolean}
        invitationPending: {type: boolean}
    UserAdministrationDetail:
      type: object
      required: [user, platformPermissions]
      properties:
        user: {$ref: '#/components/schemas/UserAdministrationSummary'}
        platformPermissions:
          type: array
          uniqueItems: true
          items: {$ref: '#/components/schemas/PlatformPermission'}
    UserAdministrationPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          properties:
            items:
              type: array
              items: {$ref: '#/components/schemas/UserAdministrationSummary'}
    OrganizationAccess:
      type: object
      required: [platformPermissions, accountingFirms]
      properties:
        platformPermissions:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [ACCOUNTING_FIRM_CREATE, ACCOUNTING_FIRM_VIEW, UNASSIGNED_COMPANY_ASSIGN, PLATFORM_USER_MANAGE]
        accountingFirms:
          type: array
          items:
            type: object
            required: [accountingFirmId, name, active, permissions]
            properties:
              accountingFirmId: {type: string, format: uuid}
              name: {type: string}
              active: {type: boolean}
              permissions:
                type: array
                uniqueItems: true
                items:
                  type: string
                  enum: [HIERARCHY_MANAGE, USER_ACCESS_MANAGE, ACCOUNTING_SOURCE_MANAGE, CONNECTOR_MANAGE]
    NameRequest:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
    CreateCompanyRequest:
      type: object
      required: [legalName, cnpj]
      properties:
        legalName: {type: string, minLength: 1, maxLength: 255}
        cnpj: {type: string, pattern: '^[0-9]{14}$'}
    CreateAccountingSourceRequest:
      type: object
      required: [type]
      properties:
        type: {type: string, enum: [QUESTOR]}
        externalReference: {type: [string, 'null'], maxLength: 255}
    AccountingFirm:
      type: object
      required: [id, name, active]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        active: {type: boolean}
    Client:
      type: object
      required: [id, accountingFirmId, name, active]
      properties:
        id: {type: string, format: uuid}
        accountingFirmId: {type: string, format: uuid}
        name: {type: string}
        active: {type: boolean}
    Company:
      type: object
      required: [id, clientId, legalName, cnpj]
      properties:
        id: {type: string, format: uuid}
        clientId: {type: string, format: uuid}
        legalName: {type: string}
        cnpj: {type: string, pattern: '^[0-9]{14}$'}
    AccountingSource:
      type: object
      required: [id, companyId, type, externalReference, active, connectionMode]
      properties:
        id: {type: string, format: uuid}
        companyId: {type: string, format: uuid}
        type: {type: string, enum: [QUESTOR]}
        externalReference: {type: [string, 'null']}
        active: {type: boolean}
        connectionMode: {type: string, enum: [DIRECT, CONNECTOR]}
    PageMetadata:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1, maximum: 100}
        totalItems: {type: integer, format: int64, minimum: 0}
        totalPages: {type: integer, minimum: 0}
    AccountingFirmPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/AccountingFirm'}}
    ClientPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/Client'}}
    CompanyPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/Company'}}
    AccountingSourcePage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/AccountingSource'}}
    InviteFirmUserRequest:
      type: object
      required: [name, email, permissions]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 255
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [HIERARCHY_MANAGE, USER_ACCESS_MANAGE, ACCOUNTING_SOURCE_MANAGE, CONNECTOR_MANAGE]
    CsrfToken:
      type: object
      required: [headerName, token]
      properties:
        headerName:
          type: string
          examples: [X-CSRF-TOKEN]
        token:
          type: string
          description: Valor opaco.
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          examples: [usuario@exemplo.invalid]
        password:
          type: string
          format: password
          writeOnly: true
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
    CompleteAccountActionRequest:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          writeOnly: true
          description: Segredo do fragmento do link; nunca registrar em logs ou telemetria.
        newPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          writeOnly: true
          description: Exige letra ASCII, dígito e no máximo 72 bytes UTF-8.
    CurrentUser:
      type: object
      required: [id, name, email, companies]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        companies:
          type: array
          items:
            $ref: '#/components/schemas/CurrentUserCompanyAccess'
    CurrentUserCompanyAccess:
      type: object
      required: [id, name, role, permissions, costCenterScope]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          $ref: '#/components/schemas/CompanyAccessRole'
        permissions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/CompanyPermission'
        costCenterScope:
          $ref: '#/components/schemas/CostCenterScope'
    AccountingMovement:
      type: object
      required:
        - id
        - accountingDate
        - accountDescription
        - accountKey
        - side
        - amount
        - history
        - sourceEntryKey
      properties:
        id:
          type: string
          format: uuid
        accountingDate:
          type: string
          format: date
        accountDescription:
          type: string
        accountKey:
          type: string
          description: Código da conta dentro da respectiva fonte/empresa; não é global.
        side:
          type: string
          enum: [DEBIT, CREDIT]
        amount:
          $ref: '#/components/schemas/DecimalAmount'
        history:
          type: [string, 'null']
        sourceEntryKey:
          type: string
    AccountingAccountClassification:
      type: object
      required:
        - accountId
        - accountingSourceId
        - accountKey
        - description
        - status
      properties:
        accountId:
          type: string
          format: uuid
        accountingSourceId:
          type: string
          format: uuid
        accountKey:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [PENDING, CLASSIFIED]
        classificationId:
          type: [string, 'null']
          format: uuid
        dreClassification:
          type: [string, 'null']
        dreOpenClassification:
          type: [string, 'null']
        ebitdaClassification:
          type: [string, 'null']
    AccountingAccountClassificationRequest:
      type: object
      additionalProperties: false
      required: [classificationId]
      properties:
        classificationId:
          type: string
          format: uuid
    DreClassification:
      type: object
      required: [id, dreClassification, dreOpenClassification, ebitdaClassification]
      properties:
        id:
          type: string
          format: uuid
        dreClassification:
          type: string
        dreOpenClassification:
          type: string
        ebitdaClassification:
          type: string
    DreCalculation:
      type: object
      required: [lines, unclassifiedAccountCount]
      properties:
        lines:
          type: array
          items:
            $ref: '#/components/schemas/DreLine'
        unclassifiedAccountCount:
          type: integer
          format: int32
          minimum: 0
    DreLine:
      type: object
      required: [dreClassification, dreOpenClassification, ebitdaClassification, total]
      properties:
        dreClassification:
          type: string
        dreOpenClassification:
          type: string
        ebitdaClassification:
          type: string
        total:
          $ref: '#/components/schemas/DecimalAmount'
    FinancialBankAccountType:
      type: string
      enum: [CURRENT, SAVINGS, CASH, INVESTMENT, DIGITAL, OTHER]
      description: Conta corrente, Poupança, Caixa, Aplicação, Conta digital e Outra, respectivamente.
    FinancialBankAccountWrite:
      type: object
      required: [name, type, openingBalance, openingDate, active]
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        type: {$ref: '#/components/schemas/FinancialBankAccountType'}
        openingBalance:
          type: [number, string]
          description: Decimal exato representável em NUMERIC(19,2), negativo permitido. Não há arredondamento; frações menores que centavo são recusadas. Zeros finais são normalizados.
          examples: ['-1.23']
        openingDate: {type: string, format: date, description: Data cadastral explícita entre os anos 1 e 9999; não implica cálculo de vigência.}
        active: {type: boolean}
        expectedVersion: {type: [integer, 'null'], format: int64, minimum: 0}
    FinancialBankAccount:
      type: object
      required: [id, companyId, name, type, openingBalance, openingDate, active, version]
      properties:
        id: {type: string, format: uuid}
        companyId: {type: string, format: uuid}
        name: {type: string}
        type: {$ref: '#/components/schemas/FinancialBankAccountType'}
        openingBalance: {type: string, description: 'Saldo inicial em string decimal de duas casas, para preservar precisão no consumidor.', examples: ['-1.23']}
        openingDate: {type: string, format: date}
        active: {type: boolean}
        version: {type: integer, format: int64, minimum: 0}
    FinancialBankAccountPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: {$ref: '#/components/schemas/FinancialBankAccount'}
    DecimalAmount:
      type: number
      description: Decimal calculado em BigDecimal no backend. O consumidor apenas formata.
      examples: [1250.50]
    CompanyAccessRole:
      type: string
      enum: [CUSTOM, ADMIN, ACCOUNTANT, CLIENT, VIEWER]
    CompanyPermission:
      type: string
      enum:
        - ACCOUNTING_MOVEMENT_VIEW
        - ACCOUNT_CLASSIFICATION_VIEW
        - DASHBOARD_VIEW
        - DRE_VIEW
        - BALANCE_SHEET_VIEW
        - CASH_FLOW_VIEW
        - INDICATORS_VIEW
        - ACCOUNT_CLASSIFICATION_MANAGE
        - MANUAL_ENTRY_MANAGE
        - QUESTOR_SYNC
        - BANK_ACCOUNT_VIEW
        - BANK_ACCOUNT_MANAGE
    CostCenterScope:
      type: string
      enum: [ALL, RESTRICTED]
    ProblemDetail:
      type: object
      properties:
        code:
          type: string
          description: Código opcional de conflito, como IDEMPOTENCY_MISMATCH ou CONCURRENT_CONFLICT.
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
security:
  - SessionCookie: []

