      properties:
        personType: {type: string, enum: [INDIVIDUAL, LEGAL_ENTITY]}
        document:
          type: string
          maxLength: 64
          description: CPF ou CNPJ com DV válido; normalizado para maiúsculas sem pontuação. CNPJ alfanumérico aceito. Resposta tem 11 ou 14 caracteres.
        name: {type: string, minLength: 2, maxLength: 255}
        tradeName: {type: [string, 'null'], maxLength: 255}
        role: {$ref: '#/components/schemas/BusinessPartnerRole'}
        active: {type: boolean}
        phone: {type: [string, 'null'], maxLength: 80}
        email: {type: [string, 'null'], maxLength: 255, description: E-mail opcional validado quando não vazio.}
        contactName: {type: [string, 'null'], maxLength: 255}
        city: {type: [string, 'null'], maxLength: 150}
        stateCode: {type: [string, 'null'], maxLength: 80, description: 'Normalizado para maiúsculas e primeiros dois caracteres, conforme referência.'}
        postalCode: {type: [string, 'null'], maxLength: 20}
        street: {type: [string, 'null'], maxLength: 255}
        streetNumber: {type: [string, 'null'], maxLength: 40}
        complement: {type: [string, 'null'], maxLength: 255}
        district: {type: [string, 'null'], maxLength: 150}
        municipalityCode: {type: [string, 'null'], maxLength: 80, description: Somente dígitos são persistidos; até20 após normalização.}
        stateRegistration: {type: [string, 'null'], maxLength: 80}
        municipalRegistration: {type: [string, 'null'], maxLength: 80}
        notes: {type: [string, 'null'], maxLength: 4000}
    BusinessPartnerWrite:
      type: object
      required: [profile]
      properties:
        profile: {$ref: '#/components/schemas/BusinessPartnerProfile'}
        expectedVersion: {type: [integer, 'null'], format: int64, minimum: 0}
    BusinessPartner:
      type: object
      required: [id, companyId, profile, version, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        companyId: {type: string, format: uuid}
        profile: {$ref: '#/components/schemas/BusinessPartnerProfile'}
        version: {type: integer, format: int64, minimum: 0}
        createdAt: {type: string, format: date-time, readOnly: true}
        updatedAt: {type: string, format: date-time, readOnly: true}
    BusinessPartnerPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: {$ref: '#/components/schemas/BusinessPartner'}
    FinancialBankAccountType:
      type: string
      enum: [CURRENT, SAVINGS, CASH, INVESTMENT, DIGITAL, OTHER]
      description: Conta corrente, Poupança, Caixa, Aplicação, Conta digital e Outra, respectivamente.
    FinancialBankAccountWrite:
      type: object
      required: [name, type, openingBalance, openingDate, active]
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        type: {$ref: '#/components/schemas/FinancialBankAccountType'}
        openingBalance:
          type: [number, string]
          description: Decimal exato representável em NUMERIC(19,2), negativo permitido. Não há arredondamento; frações menores que centavo são recusadas. Zeros finais são normalizados.
          examples: ['-1.23']
        openingDate: {type: string, format: date, description: Data cadastral explícita entre os anos 1 e 9999; não implica cálculo de vigência.}
        active: {type: boolean}
        expectedVersion: {type: [integer, 'null'], format: int64, minimum: 0}
    FinancialBankAccount:
      type: object
      required: [id, companyId, name, type, openingBalance, openingDate, active, version]
      properties:
        id: {type: string, format: uuid}
        companyId: {type: string, format: uuid}
        name: {type: string}
        type: {$ref: '#/components/schemas/FinancialBankAccountType'}
        openingBalance: {type: string, description: 'Saldo inicial em string decimal de duas casas, para preservar precisão no consumidor.', examples: ['-1.23']}
        openingDate: {type: string, format: date}
        active: {type: boolean}
        version: {type: integer, format: int64, minimum: 0}
    FinancialBankAccountPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: {$ref: '#/components/schemas/FinancialBankAccount'}
    DecimalAmount:
      type: number
      description: Decimal calculado em BigDecimal no backend. O consumidor apenas formata.
      examples: [1250.50]
    CompanyAccessRole:
      type: string
      enum: [CUSTOM, ADMIN, ACCOUNTANT, CLIENT, VIEWER]
    CompanyPermission:
      type: string
      enum:
        - ACCOUNTING_MOVEMENT_VIEW
        - ACCOUNT_CLASSIFICATION_VIEW
        - DASHBOARD_VIEW
        - DRE_VIEW
        - BALANCE_SHEET_VIEW
        - CASH_FLOW_VIEW
        - INDICATORS_VIEW
        - ACCOUNT_CLASSIFICATION_MANAGE
        - MANUAL_ENTRY_MANAGE
        - QUESTOR_SYNC
        - BANK_ACCOUNT_VIEW
        - BANK_ACCOUNT_MANAGE
        - BUSINESS_PARTNER_VIEW
        - BUSINESS_PARTNER_MANAGE
        - RESULT_CENTER_VIEW
        - RESULT_CENTER_MANAGE
        - FINANCIAL_CATEGORY_VIEW
        - FINANCIAL_CATEGORY_MANAGE
        - FINANCIAL_ENTRY_VIEW
        - FINANCIAL_ENTRY_MANAGE
        - FINANCIAL_PERIOD_VIEW
        - FINANCIAL_PERIOD_CLOSE
        - FINANCIAL_PERIOD_REOPEN
    CostCenterScope:
      type: string
      enum: [ALL, RESTRICTED]
    ProblemDetail:
      type: object
      properties:
        code:
          type: string
          description: Código opcional de conflito, como IDEMPOTENCY_MISMATCH ou CONCURRENT_CONFLICT.
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
security:
