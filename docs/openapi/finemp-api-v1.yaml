    put:
      tags: [Result centers]
      operationId: updateResultCenter
      summary: Atualiza nome, estado ativo e tipo sem alterar código ou pai.
      description: Exige MANAGE ALL. expectedVersion obrigatório e não negativo; zero é válido. type omitido preserva o tipo atual. Mudança para GROUP com lançamentos é recusada com HAS_ENTRIES, preservando o histórico.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, active, expectedVersion]
              properties:
                name: {type: string, minLength: 2, maxLength: 80}
                type: {type: string, enum: [GROUP, ANALYTICAL]}
                active: {type: boolean}
                expectedVersion: {type: integer, format: int64, minimum: 0}
      responses:
        '200':
          description: Estado e versão após flush.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResultCenter'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: STALE_VERSION ou conflito concorrente.
    delete:
      tags: [Result centers]
      operationId: deleteResultCenter
      summary: Desativa centro usado ou exclui folha sem uso.
      description: MANAGE ALL. Uso por lançamento/contrato desativa; sem uso e com filhos recusa. Guardas reais dependem39/42. Não existe quantidade mínima.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: version
          in: query
          required: true
          schema: {type: integer, format: int64, minimum: 0}
      responses:
        '200':
          description: DELETED ou DEACTIVATED; se desativado, consulte GET para nova versão.
          content:
            application/json:
              schema:
                type: object
                required: [id, action]
                properties:
                  id: {type: string, format: uuid}
                  action: {type: string, enum: [DELETED, DEACTIVATED]}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: STALE_VERSION, HAS_CHILDREN ou conflito físico/concorrente.
  /api/companies/{companyId}/result-centers/suggested-plan:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    post:
      tags: [Result centers]
      operationId: createSuggestedResultCenterPlan
      summary: Cria explicitamente os sete centros sugeridos da referência.
      description: MANAGE ALL, sessão e CSRF. Somente plano vazio; transação atômica. Não é carga automática nem mescla de planos.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '201':
          description: Plano sugerido persistido.
          content:
            application/json:
              schema:
                type: array
                minItems: 7
                maxItems: 7
                items: {$ref: '#/components/schemas/ResultCenter'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: PLAN_NOT_EMPTY ou conflito concorrente; nenhuma inclusão parcial.
  /api/companies/{companyId}/result-centers/settings:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Result centers]
      operationId: getResultCenterSettings
      summary: Consulta exigência de centro para futuros lançamentos.
      description: VIEW ou MANAGE ALL. Antes de persistir, false e version=null. Não altera histórico nem afirma enforcement dos módulos ainda pendentes.
      responses:
        '200':
          description: Configuração da Empresa.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResultCenterSettings'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    put:
      tags: [Result centers]
      operationId: updateResultCenterSettings
      summary: Persiste exigência com controle de versão.
      description: MANAGE ALL e CSRF. Primeiro PUT usa expectedVersion omitido/null; atualizações exigem versão persistida exata, inclusive zero. Não reclassifica lançamentos.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requireResultCenter]
              properties:
                requireResultCenter: {type: boolean}
                expectedVersion: {type: [integer, 'null'], format: int64, minimum: 0}
      responses:
        '200':
          description: Configuração e versão após persistência.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResultCenterSettings'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: STALE_VERSION ou conflito concorrente.
  /api/companies/{companyId}/business-partners:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Business partners]
      operationId: listBusinessPartners
      summary: Lista parceiros comerciais da empresa autorizada.
      description: Condicional a FINEMP_FINANCE_CATALOG_ENABLED. Exige BUSINESS_PARTNER_VIEW ou MANAGE e escopo ALL. Parceiros comerciais não são Clients SaaS. Ordem por nome de exibição normalizado e UUID; filtros omitidos incluem ativos e inativos.
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - name: search
          in: query
          schema: {type: string, maxLength: 100, default: ''}
          description: Nome/fantasia/cidade sem acentos ou diferença de caixa. Documento normalizado a partir de três caracteres. Busca literal; percentual não é wildcard.
        - name: role
          in: query
          schema: {$ref: '#/components/schemas/BusinessPartnerRole'}
          description: CUSTOMER e SUPPLIER incluem BOTH. BOTH retorna somente os dois papéis.
        - name: active
          in: query
          schema: {type: boolean}
      responses:
        '200':
          description: Página da empresa.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BusinessPartnerPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Business partners]
      operationId: createBusinessPartner
      summary: Cadastra parceiro PF/PJ com documento validado.
      description: Exige BUSINESS_PARTNER_MANAGE ALL, sessão e CSRF. Documento obrigatório e único por Empresa inclusive inativos; expectedVersion ausente ou null. Não consulta serviço externo. Cadastros pendentes legados/importação não são criados por esta operação.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BusinessPartnerWrite'}
      responses:
        '201':
          description: Parceiro criado com versão zero e datas do servidor.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BusinessPartner'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: Documento duplicado ou conflito de estado; resposta não inclui dados pessoais.
  /api/companies/{companyId}/business-partners/{partnerId}:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - name: partnerId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [Business partners]
      operationId: getBusinessPartner
      summary: Consulta parceiro da empresa com VIEW ou MANAGE ALL.
      responses:
        '200':
          description: Parceiro autorizado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BusinessPartner'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Business partners]
      operationId: updateBusinessPartner
      summary: Substitui cadastro sem sobrescrever uma versão posterior.
      description: Exige MANAGE ALL. expectedVersion obrigatório; zero é válido. Documento é revalidado e mantém unicidade na Empresa. Timestamps e versão são controlados pelo servidor.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/BusinessPartnerWrite'
                - type: object
                  required: [expectedVersion]
                  properties:
                    expectedVersion: {type: integer, format: int64, minimum: 0}
      responses:
        '200':
          description: Estado e versão após persistência.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BusinessPartner'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: STALE_VERSION, DUPLICATE_DOCUMENT ou conflito concorrente.
    delete:
      tags: [Business partners]
      operationId: deleteBusinessPartner
      summary: Exclui parceiro sem uso ou desativa histórico referenciado.
      description: Exige MANAGE ALL. Integração com referências reais dos módulos operacionais depende da entrega39. Não há mínimo de parceiros. Constraint física protege referências existentes.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: version
          in: query
          required: true
          schema: {type: integer, format: int64, minimum: 0}
      responses:
        '200':
          description: Ação realizada; se desativado, consulte GET para a versão atual.
          content:
            application/json:
              schema:
                type: object
                required: [id, action]
                properties:
                  id: {type: string, format: uuid}
                  action: {type: string, enum: [DELETED, DEACTIVATED]}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Versão divergente ou referência/conflito concorrente.
  /api/companies/{companyId}/financial-reports/daily-cash-totals:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Financial reports]
      operationId: getDailyCashTotals
      summary: Resume valores realizados e em aberto por data.
      description: >-
        Condicional a FINEMP_FINANCE_DAILY_CASH_ENABLED; exige FINANCIAL_ENTRY_VIEW
        ou FINANCIAL_ENTRY_MANAGE ALL. Baixados usam data e valor efetivo da baixa;
        abertos usam vencimento e valor nominal. Retorna todos os dias do mês em
        snapshot consistente, com valores decimais exatos em texto. Não inclui saldo,
        transferências ou projeção; títulos atrasados não são deslocados para hoje.
        Não escolhe período padrão nem reconstrói histórico de alterações.
      parameters:
        - name: month
          in: query
          required: true
          schema: {type: string, pattern: '^(?!0000)[0-9]{4}-(0[1-9]|1[0-2])$'}
      responses:
        '200':
          description: Totais diários sem cache.
          content:
            application/json:
              schema:
                type: object
                required: [month, days]
                properties:
                  month: {type: string}
                  days:
                    type: array
                    minItems: 28
                    maxItems: 31
                    items:
                      type: object
                      required: [date, realIncome, realExpense, openIncome, openExpense]
                      properties:
                        date: {type: string, format: date}
                        realIncome: {type: string}
                        realExpense: {type: string}
                        openIncome: {type: string}
                        openExpense: {type: string}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/companies/{companyId}/financial-reports/presentation-snapshot:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Financial reports]
      operationId: getPartialPresentationSnapshot
      summary: Reúne caixa parcial e aging em um único snapshot consistente.
      description: >-
        Exige sessão e FINANCIAL_ENTRY_VIEW ou FINANCIAL_ENTRY_MANAGE ALL.
        Habilitar FINEMP_FINANCE_PRESENTATION_ENABLED e os produtores
        FINEMP_FINANCE_AGING_ENABLED, FINEMP_FINANCE_DAILY_CASH_ENABLED e
        FINEMP_FINANCE_MONTHLY_CASH_ENABLED. Mês, data-base e escopo são explícitos
        e independentes; não há período padrão ou fallback. Caixa anual usa o ano
        de month. Todos os blocos são calculados pelo backend na mesma transação.
        Não inclui DRE operacional, indicadores, saldo, projeção ou orçamento.
        O aging aplica a data-base ao estado atual, sem reconstrução histórica.
      parameters:
        - name: month
          in: query
          required: true
          schema: {type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'}
          description: Mês de caixa YYYY-MM entre 0001-01 e 9999-12.
        - name: asOf
          in: query
          required: true
          schema: {type: string, format: date}
          description: Data-base explícita do aging entre os anos 1 e 9999.
        - name: scope
          in: query
          required: true
          schema: {type: string, enum: [ALL, COMPETENCE]}
      responses:
        '200':
          description: Blocos parciais consistentes, sem cache e com valores monetários em texto.
          content:
            application/json:
              schema:
                type: object
                required: [schemaVersion, partial, companyId, month, asOf, scope, cashMonth, cashYear, payables, receivables]
                properties:
                  schemaVersion: {type: integer, enum: [1]}
                  partial: {type: boolean, enum: [true]}
                  companyId: {type: string, format: uuid}
                  month: {type: string}
                  asOf: {type: string, format: date}
                  scope: {type: string, enum: [ALL, COMPETENCE]}
                  cashMonth:
                    $ref: '#/paths/~1api~1companies~1{companyId}~1financial-reports~1daily-cash-totals/get/responses/200/content/application~1json/schema'
                  cashYear:
                    $ref: '#/paths/~1api~1companies~1{companyId}~1financial-reports~1monthly-cash-totals/get/responses/200/content/application~1json/schema'
                  payables:
                    $ref: '#/paths/~1api~1companies~1{companyId}~1financial-reports~1open-titles~1aging/get/responses/200/content/application~1json/schema'
                  receivables:
                    $ref: '#/paths/~1api~1companies~1{companyId}~1financial-reports~1open-titles~1aging/get/responses/200/content/application~1json/schema'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/companies/{companyId}/financial-reports/monthly-cash-totals:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Financial reports]
      operationId: getMonthlyCashTotals
      summary: Resume entradas e saídas realizadas e em aberto por mês.
      description: >-
        Condicional a FINEMP_FINANCE_MONTHLY_CASH_ENABLED; exige permissão
        FINANCIAL_ENTRY_VIEW ou FINANCIAL_ENTRY_MANAGE ALL. Realizado usa data
        de pagamento e valor efetivo; em aberto usa vencimento e valor nominal.
        Retorna os 12 meses do ano informado, com valores decimais exatos em texto.
        É uma fatia do fluxo atual; não inclui saldos, transferências, forma de
        pagamento ou reconstrução histórica. Não escolhe período padrão.
      parameters:
        - name: year
          in: query
          required: true
          schema: {type: integer, minimum: 1, maximum: 9999}
      responses:
        '200':
          description: Totais mensais em snapshot consistente e sem cache.
          content:
            application/json:
              schema:
                type: object
                required: [year, months, totalRealIncome, totalRealExpense, totalOpenIncome, totalOpenExpense]
                properties:
                  year: {type: integer}
                  totalRealIncome: {type: string, description: Soma das entradas realizadas dos 12 meses.}
                  totalRealExpense: {type: string, description: Soma das saídas realizadas dos 12 meses.}
                  totalOpenIncome: {type: string, description: Soma das entradas em aberto dos 12 meses.}
                  totalOpenExpense: {type: string, description: Soma das saídas em aberto dos 12 meses.}
                  months:
                    type: array
                    minItems: 12
                    maxItems: 12
                    items:
                      type: object
                      required: [month, realIncome, realExpense, openIncome, openExpense]
                      properties:
                        month: {type: integer, minimum: 1, maximum: 12}
                        realIncome: {type: string}
                        realExpense: {type: string}
                        openIncome: {type: string}
                        openExpense: {type: string}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/companies/{companyId}/financial-reports/open-titles/by-partner:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Financial reports]
      operationId: listOpenTitlePartnerTotals
      summary: Subtotais de títulos por cliente ou fornecedor, paginados no servidor.
      description: >-
        Requer FINEMP_FINANCE_OPEN_TITLES_ENABLED e FINANCIAL_ENTRY_VIEW ou
        FINANCIAL_ENTRY_MANAGE ALL vigente. Usa os mesmos filtros do detalhamento,
        soma valor nominal e conta títulos por partnerId, incluindo grupo sem parceiro.
        Parceiros inativos com títulos não são descartados. totalItems/totalPages
        contam grupos, não títulos. Ordena pela chave de nome do catálogo e ID;
        grupo sem parceiro ao final. Não reconstrói alterações históricas.
      parameters:
        - name: direction
          in: query
          required: true
          schema: {type: string, enum: [INCOME, EXPENSE]}
        - name: asOf
          in: query
          required: true
          schema: {type: string, format: date}
        - name: scope
          in: query
          schema: {type: string, enum: [ALL, COMPETENCE], default: ALL}
        - name: band
          in: query
          schema: {type: string, enum: [DUE_0_30, DUE_31_60, DUE_61_90, DUE_OVER_90, OVERDUE_1_30, OVERDUE_31_60, OVERDUE_61_90, OVERDUE_OVER_90]}
        - $ref: '#/components/parameters/Page'
        - name: size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: Grupos em snapshot consistente; dinheiro textual e no-store.
          content:
            application/json:
              schema:
                type: object
                required: [items, page, size, totalItems, totalPages]
                properties:
                  page: {type: integer}
                  size: {type: integer}
                  totalItems: {type: integer, format: int64, description: Quantidade total de grupos.}
                  totalPages: {type: integer}
                  items:
                    type: array
                    items:
                      type: object
                      required: [partnerId, partnerName, titleCount, nominalAmount]
                      properties:
                        partnerId: {type: string, format: uuid, nullable: true}
                        partnerName: {type: string, nullable: true}
                        titleCount: {type: integer, format: int64}
                        nominalAmount: {type: string}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/companies/{companyId}/financial-reports/open-titles:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Financial reports]
      operationId: listOpenTitlesAsOf
      summary: Lista paginada de títulos em aberto na data-base informada.
      description: >-
        Condicional a FINEMP_FINANCE_OPEN_TITLES_ENABLED; exige FINANCIAL_ENTRY_VIEW
        ou FINANCIAL_ENTRY_MANAGE ALL. Usa os mesmos critérios do aging: títulos sem
        pagamento ou pagos depois da data-base, valor nominal, sem filtro de emissão;
        COMPETENCE limita competência ao mês da data-base. O servidor calcula dias
        de atraso e faixa, e aplica paginação no banco em snapshot consistente. Estado
        atual aplicado à data-base não reconstrói alterações nem estornos históricos.
        O filtro band opcional limita linhas e contagem à mesma faixa do resumo de aging.
        partnerId limita ao parceiro na Company; unassignedPartner=true seleciona
        títulos sem parceiro. Não combinar ambos. Identificador externo retorna
        página vazia sem revelar dados de outra Company.
      parameters:
        - name: direction
          in: query
          required: true
          schema: {type: string, enum: [INCOME, EXPENSE]}
        - name: asOf
          in: query
          required: true
          schema: {type: string, format: date}
        - name: scope
          in: query
          schema: {type: string, enum: [ALL, COMPETENCE], default: ALL}
        - name: band
          in: query
          description: Faixa opcional do aging; omitida retorna todas as faixas.
          schema: {type: string, enum: [DUE_0_30, DUE_31_60, DUE_61_90, DUE_OVER_90, OVERDUE_1_30, OVERDUE_31_60, OVERDUE_61_90, OVERDUE_OVER_90]}
        - name: partnerId
          in: query
          schema: {type: string, format: uuid}
          description: Parceiro do grupo consultado; incompatível com unassignedPartner=true.
        - name: unassignedPartner
          in: query
          schema: {type: boolean, default: false}
          description: Quando true, limita a títulos sem parceiro.
        - $ref: '#/components/parameters/Page'
        - name: size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: Página por vencimento e identificador, sem cache; valores exatos em texto.
          content:
            application/json:
              schema:
                type: object
                required: [items, page, size, totalItems, totalPages]
                properties:
                  page: {type: integer}
                  size: {type: integer}
                  totalItems: {type: integer, format: int64}
                  totalPages: {type: integer}
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string, format: uuid}
                        description: {type: string}
                        direction: {type: string, enum: [INCOME, EXPENSE]}
                        nominalAmount: {type: string}
                        competence: {type: string}
                        dueDate: {type: string, format: date}
                        paymentDate: {type: string, format: date, nullable: true}
                        daysLate: {type: integer}
                        documentNumber: {type: string, description: Documento informado no lançamento; pode ser vazio.}
                        documentDate: {type: string, format: date}
                        categoryId: {type: string, format: uuid}
                        band: {type: string, enum: [DUE_0_30, DUE_31_60, DUE_61_90, DUE_OVER_90, OVERDUE_1_30, OVERDUE_31_60, OVERDUE_61_90, OVERDUE_OVER_90]}
                        bankAccountId: {type: string, format: uuid}
                        partnerId: {type: string, format: uuid, nullable: true}
                        resultCenterId: {type: string, format: uuid, nullable: true}
                        version: {type: integer, format: int64}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/companies/{companyId}/financial-reports/open-titles/aging:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Financial reports]
      operationId: getOpenTitlesAging
      summary: Resume títulos por faixa de vencimento na data-base informada.
      description: >-
        Condicional a FINEMP_FINANCE_AGING_ENABLED. Exige FINANCIAL_ENTRY_VIEW ou
        FINANCIAL_ENTRY_MANAGE ALL. Considera títulos sem pagamento ou pagos após
        a data-base, usando valor nominal e sem filtro de data de emissão. A opção
        COMPETENCE inclui apenas competência até o mês da data-base. Vencimento na
        data-base está na faixa a vencer até 30 dias. Consulta o estado atual com
        data-base; não reconstrói alterações e estornos históricos. Não escolhe
        período padrão e não calcula números no frontend.
      parameters:
        - name: direction
          in: query
          required: true
          schema: {type: string, enum: [INCOME, EXPENSE]}
        - name: asOf
          in: query
          required: true
          schema: {type: string, format: date}
        - name: scope
          in: query
          schema: {type: string, enum: [ALL, COMPETENCE], default: ALL}
      responses:
        '200':
          description: Totais e oito faixas em snapshot consistente; valores em texto decimal exato.
          content:
            application/json:
              schema:
                type: object
                required: [asOf, direction, scope, totalCount, totalAmount, overdueCount, overdueAmount, dueWithin30Count, dueWithin30Amount, bands]
                properties:
                  asOf: {type: string, format: date}
                  direction: {type: string, enum: [INCOME, EXPENSE]}
                  scope: {type: string, enum: [ALL, COMPETENCE]}
                  totalCount: {type: integer, format: int64}
                  totalAmount: {type: string}
                  overdueCount: {type: integer, format: int64}
                  overdueAmount: {type: string}
                  dueWithin30Count: {type: integer, format: int64}
                  dueWithin30Amount: {type: string}
                  bands:
                    type: array
                    minItems: 8
                    maxItems: 8
                    items:
                      type: object
                      required: [band, count, amount]
                      properties:
                        band: {type: string, enum: [DUE_0_30, DUE_31_60, DUE_61_90, DUE_OVER_90, OVERDUE_1_30, OVERDUE_31_60, OVERDUE_61_90, OVERDUE_OVER_90]}
                        count: {type: integer, format: int64}
                        amount: {type: string}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/companies/{companyId}/statement-items/{statementId}/ignore:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - name: statementId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: [Financial bank accounts]
      operationId: ignoreStatementItem
      summary: Marca um movimento de extrato pendente como ignorado.
      description: >-
        Exige FINEMP_FINANCE_STATEMENT_ACTIONS_ENABLED, os opt-ins de comandos
        financeiros, sessão, CSRF e FINANCIAL_ENTRY_MANAGE ALL. O corpo é JSON
        estrito e limitado pelo filtro financeiro. O mês da data do extrato deve
        estar aberto; versão divergente ou movimento já conciliado/ignorado conflita.
        A operação não altera lançamento, baixa ou saldo. Repetição idêntica devolve
        o recibo, inclusive após fechamento; outra solicitação com a mesma chave conflita.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/FinancialCommandKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion]
              properties:
                expectedVersion: {type: integer, format: int64, minimum: 0}
      responses:
        '200':
          description: Recibo idempotente com versão e evento de auditoria.
          content:
            application/json:
              schema:
                type: object
                required: [companyId, itemId, commandId, version, auditEventId]
                properties:
                  companyId: {type: string, format: uuid}
                  itemId: {type: string, format: uuid}
                  commandId: {type: string, format: uuid}
                  version: {type: integer, format: int64}
                  auditEventId: {type: string, format: uuid}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Período fechado, versão, estado ou chave conflitante.}
        '413': {description: Corpo excede limite do filtro financeiro.}
        '415': {description: Tipo ou codificação não suportada.}
        '429': {description: Limite de comandos simultâneos atingido.}
  /api/companies/{companyId}/statement-items/{statementId}/candidates:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - name: statementId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [Financial bank accounts]
      operationId: listStatementReconciliationCandidates
      summary: Lista sugestões de conciliação para movimento de extrato.
      description: >-
        Condicional a FINEMP_FINANCE_STATEMENT_CANDIDATES_ENABLED; exige
        FINANCIAL_ENTRY_VIEW ou FINANCIAL_ENTRY_MANAGE com escopo ALL. Retorna
        sugestões sem alterar lançamentos ou conciliar. Baixados da mesma conta
        até três dias de distância precedem abertos até quinze dias de vencimento;
        o valor deve diferir menos de 0,011 e lançamentos já vinculados são omitidos.
        Paginação e filtros são aplicados no banco em snapshot de leitura consistente;
        empates são ordenados pelo identificador. Valores são strings decimais exatas.
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - name: status
          in: query
          schema: {type: string, enum: [PAID, OPEN]}
      responses:
        '200':
          description: Página de sugestões sem cache.
          content:
            application/json:
              schema:
                type: object
                required: [items, page, size, totalItems, totalPages]
                properties:
                  page: {type: integer}
                  size: {type: integer}
                  totalItems: {type: integer, format: int64}
                  totalPages: {type: integer}
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        entryId: {type: string, format: uuid}
                        description: {type: string}
                        direction: {type: string, enum: [INCOME, EXPENSE]}
                        bankAccountId: {type: string, format: uuid}
                        dueDate: {type: string, format: date}
                        paymentDate: {type: string, format: date, nullable: true}
                        nominalAmount: {type: string}
                        actualPaidAmount: {type: string, nullable: true}
                        version: {type: integer, format: int64}
                        distanceDays: {type: integer}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/companies/{companyId}/bank-accounts/{bankId}/statement-items:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - name: bankId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [Financial bank accounts]
      operationId: listStatementItems
      summary: Lista movimentos de extrato armazenados na conta da empresa.
      description: >-
        Condicional a FINEMP_FINANCE_STATEMENT_READ_ENABLED; exige FINANCIAL_ENTRY_VIEW
        ou FINANCIAL_ENTRY_MANAGE ALL. Filtros e paginação no PostgreSQL em snapshot
        consistente; ordenação por data decrescente e identificador. O valor com sinal
        é retornado como texto decimal exato. Nenhuma mutação é realizada.
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - name: status
          in: query
          schema: {type: string, enum: [PENDING, IGNORED, RECONCILED]}
        - name: from
          in: query
          schema: {type: string, format: date}
        - name: to
          in: query
          schema: {type: string, format: date}
      responses:
        '200':
          description: Página de movimentos sem cache.
          content:
            application/json:
              schema:
                type: object
                required: [items, page, size, totalItems, totalPages]
                properties:
                  page: {type: integer}
                  size: {type: integer}
                  totalItems: {type: integer, format: int64}
                  totalPages: {type: integer}
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, bankAccountId, values, status, version]
                      properties:
                        id: {type: string, format: uuid}
                        bankAccountId: {type: string, format: uuid}
                        status: {type: string, enum: [PENDING, IGNORED, RECONCILED]}
                        linkedEntryId: {type: string, format: uuid, nullable: true}
                        createdBy: {type: string, format: uuid}
                        createdAt: {type: string, format: date-time}
                        version: {type: integer, format: int64}
                        values:
                          type: object
                          required: [postedDate, signedAmount, memo, externalId, documentReference]
                          properties:
                            postedDate: {type: string, format: date}
                            signedAmount: {type: string}
                            memo: {type: string}
                            externalId: {type: string}
                            documentReference: {type: string}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/companies/{companyId}/bank-accounts/{bankId}/statement-previews:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - name: bankId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: [Financial bank accounts]
      operationId: previewBankStatement
      summary: Analisa temporariamente extrato OFX ou CSV da empresa autorizada.
      description: >-
        Condicional a FINEMP_FINANCE_STATEMENT_PREVIEW_ENABLED. Exige sessão, CSRF,
        FINANCIAL_ENTRY_MANAGE com escopo ALL e conta pertencente à empresa. A análise
        não persiste, concilia, baixa nem modifica saldos. O corpo é limitado a 16 MiB;
        uma operação de arquivo por instância é permitida. CSV requer separador
        explícito; OFX não aceita separador. Linhas inválidas e possíveis duplicidades
        são apresentadas; nenhuma duplicidade é confirmada automaticamente. Moeda e
        múltiplas contas do arquivo devem ser verificadas antes de futura importação.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: format
          in: query
          required: true
          schema: {type: string, enum: [OFX, CSV]}
        - name: separator
          in: query
          required: false
          schema: {type: string, enum: [COMMA, SEMICOLON, TAB, PIPE]}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        '200':
          description: Prévia temporária; resposta sem cache. Valores monetários são strings decimais exatas.
          headers:
            X-Statement-SHA256:
              description: SHA-256 do arquivo analisado, usado para confirmar o mesmo conteúdo.
              schema: {type: string, pattern: '^[0-9a-f]{64}$'}
          content:
            application/json:
              schema:
                type: object
                required: [rows, warnings]
                properties:
                  bankCode: {type: string, description: Presente na prévia OFX.}
                  accountReference: {type: string, description: Presente na prévia OFX.}
                  currency: {type: string, description: Presente na prévia OFX.}
                  balance:
                    nullable: true
                    type: object
                    properties:
                      date: {type: string, format: date}
                      amount: {type: string, description: Valor decimal exato.}
                  warnings:
                    type: array
                    items: {type: string}
                  rows:
                    type: array
                    items:
                      type: object
                      required: [number, warnings]
                      properties:
                        number: {type: integer}
                        rawDate: {type: string}
                        rawAmount: {type: string}
                        rawMemo: {type: string}
                        error: {type: string, nullable: true}
                        warnings:
                          type: array
                          items: {type: string}
                        values:
                          type: object
                          nullable: true
                          properties:
                            postedDate: {type: string, format: date}
                            signedAmount: {type: string, description: Valor decimal exato com sinal.}
                            memo: {type: string}
                            externalId: {type: string}
                            documentReference: {type: string}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {description: Arquivo excede o limite.}
        '415': {description: Tipo ou codificação de conteúdo não suportado.}
        '429': {description: Limite de análises simultâneas atingido.}
  /api/companies/{companyId}/bank-accounts/{bankId}/statement-imports:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - name: bankId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: [Financial bank accounts]
      operationId: confirmBankStatementImport
      summary: Confirma movimentos escolhidos após a prévia.
      description: >-
        Condicional a FINEMP_FINANCE_STATEMENT_IMPORT_ENABLED. Exige sessão, CSRF,
        FINANCIAL_ENTRY_MANAGE ALL, conta da empresa e confirmações explícitas da
        conta, da moeda em reais e dos alertas examinados. O servidor verifica o SHA
        da prévia, reprocessa o arquivo e usa apenas as linhas selecionadas válidas.
        Arquivos OFX com múltiplas contas, bancos ou moedas, metadados bancários
        inválidos ou moeda explicitamente diferente de BRL são recusados. Não há
        baixa nem conciliação. Limite técnico: arquivo de 8 MiB, corpo de 12 MiB e
        até 5.000 linhas. Reenvio idêntico retorna o recibo; a mesma chave com corpo
        diferente conflita. A análise e a confirmação compartilham capacidade limitada.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/FinancialCommandKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [format, fileBase64, fileSha256, selectedRows, accountConfirmed, currencyConfirmed, warningsConfirmed]
              properties:
                format: {type: string, enum: [OFX, CSV]}
                separator: {type: string, enum: [COMMA, SEMICOLON, TAB, PIPE], description: Obrigatório apenas para CSV.}
                fileBase64: {type: string, format: byte, description: Arquivo original reapresentado para validação no servidor.}
                fileSha256: {type: string, pattern: '^[0-9a-f]{64}$', description: Valor de X-Statement-SHA256 recebido na prévia.}
                selectedRows:
                  type: array
                  minItems: 1
                  maxItems: 5000
                  uniqueItems: true
                  items: {type: integer, minimum: 1}
                accountConfirmed: {type: boolean, enum: [true], description: O usuário confirma a escolha da conta financeira.}
                currencyConfirmed: {type: boolean, enum: [true], description: O usuário confirma a moeda em reais.}
                warningsConfirmed: {type: boolean, enum: [true], description: O usuário examinou e confirmou os alertas da prévia.}
      responses:
        '200':
          description: Recibo da operação ou reexecução idêntica, sem cache.
          content:
            application/json:
              schema:
                type: object
                required: [companyId, bankAccountId, commandId, itemIds, auditEventId]
                properties:
                  companyId: {type: string, format: uuid}
                  bankAccountId: {type: string, format: uuid}
                  commandId: {type: string, format: uuid}
                  itemIds: {type: array, items: {type: string, format: uuid}}
                  auditEventId: {type: string, format: uuid}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Período fechado, FITID em conflito, chave reutilizada ou estado concorrente.}
        '413': {description: Corpo excede o limite.}
        '415': {description: Tipo ou codificação de conteúdo não suportado.}
        '429': {description: Limite de operações simultâneas atingido.}
  /api/companies/{companyId}/bank-accounts:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Financial bank accounts]
      operationId: listFinancialBankAccounts
      summary: Lista contas financeiras operacionais da empresa autorizada.
      description: Condicional a FINEMP_FINANCE_CATALOG_ENABLED. Exige BANK_ACCOUNT_VIEW ou BANK_ACCOUNT_MANAGE e escopo ALL. Não é plano contábil nem consulta Questor. Ordem estável por nome e UUID.
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - name: search
          in: query
          schema: {type: string, maxLength: 100, default: ''}
          description: Busca literal no nome, sem diferenciar maiúsculas. Percentual não é wildcard.
        - name: type
          in: query
          schema: {$ref: '#/components/schemas/FinancialBankAccountType'}
        - name: active
          in: query
          schema: {type: boolean}
      responses:
        '200':
          description: Página restrita à empresa.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FinancialBankAccountPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Financial bank accounts]
      operationId: createFinancialBankAccount
      summary: Cria conta operacional sem conceder acesso financeiro por papel administrativo.
      description: Exige BANK_ACCOUNT_MANAGE ALL, sessão e CSRF. Data e valores explícitos; saldo inicial não é saldo calculado. expectedVersion deve ser ausente ou null na criação.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FinancialBankAccountWrite'}
      responses:
        '201':
          description: Conta criada, com versão inicial zero.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FinancialBankAccount'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: Conflito de estado ou recurso ocupado; nenhuma escrita parcial.
  /api/companies/{companyId}/bank-accounts/{bankId}:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - name: bankId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [Financial bank accounts]
      operationId: getFinancialBankAccount
      summary: Consulta uma conta dentro da empresa autorizada.
      responses:
        '200':
          description: Conta financeira; abertura monetária como string decimal exata.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FinancialBankAccount'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Financial bank accounts]
      operationId: updateFinancialBankAccount
      summary: Substitui dados cadastrais sem alterar a empresa proprietária.
      description: Exige BANK_ACCOUNT_MANAGE ALL e expectedVersion atual. Resposta inclui a versão após flush; versão divergente retorna 409 STALE_VERSION.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/FinancialBankAccountWrite'
                - type: object
                  required: [expectedVersion]
                  properties:
                    expectedVersion: {type: integer, format: int64, minimum: 0}
      responses:
        '200':
          description: Dados persistidos e versão atualizada.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FinancialBankAccount'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Versão divergente, integridade ou transação incompatível; consultar estado atual.
    delete:
      tags: [Financial bank accounts]
      operationId: deleteFinancialBankAccount
      summary: Remove conta sem uso ou desativa histórico referenciado.
      description: Exige BANK_ACCOUNT_MANAGE ALL, versão atual e CSRF. Não remove a última linha sem referências, mesmo se inativa. Guardas de referências são fornecidas pelos módulos operacionais; integração real com lançamentos/transferências acompanha a entrega desses módulos. Nunca usa AccountingMovement como substituto.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: version
          in: query
          required: true
          schema: {type: integer, format: int64, minimum: 0}
      responses:
        '200':
          description: Ação aplicada; após DEACTIVATED consultar a conta para obter a nova versão.
          content:
            application/json:
              schema:
                type: object
                required: [id, action]
                properties:
                  id: {type: string, format: uuid}
                  action: {type: string, enum: [DELETED, DEACTIVATED]}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: STALE_VERSION, LAST_ACCOUNT, TRANSACTION_NOT_SUPPORTED ou BANK_ACCOUNT_CONFLICT.
  /api/connector/v1/work/{attemptId}/complete:
    parameters:
      - name: attemptId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: [Connector machine protocol]
      operationId: completeConnectorWork
      summary: Valida e publica um lote inteiro com autoridade e contexto reconstruídos no servidor.
      description: Parser fora de transação; publicação revalida credencial/versão/fonte/solicitante/lease/fence sob a mesma trava. Server mede counters. POST já encerrado retorna 409; consultar result para resolver resposta perdida. Identidade observada é declaração do agente, que deverá lê-la realmente no ERP.
      security:
        - ConnectorBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConnectorBatch'}
      responses:
        '200':
          description: Tentativa publicada; contas/movimentos/counters/sucesso/evento confirmados juntos.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConnectorWorkResult'}
        '202':
          description: Publicação revertida por falha transitória; tentativa falhou e retry foi agendado pelo lifecycle.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConnectorWorkResult'}
        '400': {description: Formato/JSON/campos inválidos; não altera a execução.}
        '401': {description: Credencial/transporte não autorizado.}
        '404': {description: Tentativa não pertence ao vínculo autenticado.}
        '409': {description: Tentativa encerrada, lease/fence não atual ou posse alterada; consultar result.}
        '413': {description: Orçamento de bytes/registros/estrutura excedido; não altera a execução.}
        '415': {description: Exige application/json sem Content-Encoding comprimido.}
        '422':
          description: Identidade/payload/conflito rejeitado ou orçamento de retries esgotado; dados anteriores preservados.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConnectorWorkResult'}
        '429': {description: Sem capacidade ou limite de autenticação; observar Retry-After.}
        '503': {description: Infraestrutura indisponível; consultar recibo antes de reenviar.}
  /api/connector/v1/work/{attemptId}/fail:
    parameters:
      - name: attemptId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: [Connector machine protocol]
      operationId: reportConnectorSourceFailure
      summary: Reporta código restrito de falha da origem, sem mensagem livre/status/counters.
      security:
        - ConnectorBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: {type: string, enum: [READ_FAILED, RESOURCE_LIMIT, IDENTITY_MISMATCH, INVALID_PAYLOAD]}
      responses:
        '202':
          description: Falha da tentativa registrada; retry limitado agendado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConnectorWorkResult'}
        '422':
          description: Falha terminal registrada, sem mutar movimentos.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConnectorWorkResult'}
        '400': {description: Formato/código inválido; não altera a execução.}
        '401': {description: Credencial/transporte não autorizado.}
        '404': {description: Tentativa não pertence ao vínculo autenticado.}
        '409': {description: Tentativa sem posse atual.}
        '413': {description: Orçamento de metadados excedido.}
        '415': {description: Exige application/json sem compressão.}
        '429': {description: Capacidade/limite de autenticação excedido.}
        '503': {description: Infraestrutura indisponível.}
  /api/connector/v1/work/{attemptId}/result:
    parameters:
      - name: attemptId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [Connector machine protocol]
      operationId: getConnectorWorkResult
      summary: Consulta recibo autoritativo da tentativa sem reenviar o lote.
      description: Mesmo vínculo e versão da credencial. Counters só são retornados quando esta tentativa teve sucesso; tentativa antiga falhada não recebe os counters de uma posterior. Não retorna linhas contábeis.
      security:
        - ConnectorBearer: []
      responses:
        '200':
          description: Estado e counters medidos, no-store.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConnectorWorkResult'}
        '400': {description: Identificador inválido.}
        '401': {description: Credencial/transporte não autorizado.}
        '404': {description: Tentativa não pertence ao vínculo autenticado.}
        '429': {description: Capacidade/limite de autenticação excedido.}
        '503': {description: Infraestrutura indisponível.}
  /api/connector/v1/work/claim:
    post:
      tags: [Connector machine protocol]
      operationId: claimConnectorWork
      summary: Obtém uma tentativa elegível exclusivamente da fonte vinculada ao bearer.
      description: Contexto/período vêm do servidor; não recebe SQL, empresa, fonte ou período escolhidos pelo agente. INITIAL apenas. Resposta perdida é recuperada após lease/backoff, com novo fence.
      security:
        - ConnectorBearer: []
      responses:
        '200':
          description: Tentativa e contexto atual, no-store; não há leitura ERP no servidor SaaS.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConnectorWork'}
        '400': {description: Corpo de requisição inválido, resposta sanitizada.}
        '413': {description: Orçamento de bytes do protocolo excedido.}
        '415': {description: Content-Encoding comprimido não é aceito.}
        '204': {description: Nenhum trabalho elegível agora; lease/backoff ou execução rejeitada pelo lifecycle.}
        '401': {description: Credencial ausente/inválida/revogada ou transporte sem TLS.}
        '429': {description: Limite de requisições; Retry-After 60s.}
        '503': {description: Infraestrutura temporariamente indisponível, sem erro livre.}
  /api/connector/v1/work/{attemptId}/heartbeat:
    parameters:
      - name: attemptId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: [Connector machine protocol]
      operationId: renewConnectorWork
      summary: Renova tentativa atual, com a mesma credencial/versão e fonte.
      description: Reconstrói contexto persistido. Não aceita extensão arbitrária, contadores ou período do agente. Rotação/revogação, perda de acesso ou lease vencido impedem renovação.
      security:
        - ConnectorBearer: []
      responses:
        '200':
          description: Novo prazo no-store, sem alterar o fence do run.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConnectorLease'}
        '413': {description: Orçamento de bytes do protocolo excedido.}
        '415': {description: Content-Encoding comprimido não é aceito.}
        '400': {description: Identificador inválido.}
        '401': {description: Credencial não vigente ou transporte sem TLS.}
        '404': {description: Tentativa não pertence ao vínculo autenticado.}
        '409': {description: Tentativa sem lease/fence atual ou acesso do solicitante removido.}
        '429': {description: Limite de requisições; Retry-After 60s.}
        '503': {description: Infraestrutura temporariamente indisponível, sem erro livre.}
  /api/connector/v1/session:
    get:
      tags: [Connector machine protocol]
      operationId: getConnectorMachineScope
      summary: Confere identidade de máquina vigente e retorna somente o vínculo de escopo.
      description: Exige HTTPS efetivo, FINEMP_CONNECTOR_ENABLED e FINEMP_CONNECTOR_PROTOCOL_ENABLED. Stateless; não aceita cookie como credencial, parâmetros de URL ou token em query. O servidor HTTP de desenvolvimento não atende este protocolo. Não executa nem publica lotes.
      security:
        - ConnectorBearer: []
      responses:
        '200':
          description: IDs e versão do vínculo, no-store, sem cookie/segredo/emissor ou dados contábeis.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConnectorMachineScope'}
        '400': {description: Corpo de requisição inválido, resposta sanitizada.}
        '413': {description: Orçamento de bytes do protocolo excedido.}
        '415': {description: Content-Encoding comprimido não é aceito.}
        '401':
          description: TLS ou credencial ausente/inválida/inativa, sempre sanitizado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConnectorProtocolError'}
        '429':
          description: Limite por endereço/credencial; Retry-After de 60 segundos.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConnectorProtocolError'}
        '503':
          description: Verificação temporariamente indisponível, sem detalhes internos.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConnectorProtocolError'}
  /api/accounting-sources/{accountingSourceId}/sync-runs:
    parameters:
      - $ref: '#/components/parameters/AccountingSourceId'
    post:
      tags: [Accounting synchronization]
      operationId: requestSynchronization
      summary: Registra intenção de sincronização; não lê ERP durante a requisição.
      description: Condicional a FINEMP_SYNC_CONTROL_ENABLED. Exige QUESTOR_SYNC na empresa da fonte e escopo ALL. Replay idêntico retorna a mesma execução, sem evento duplicado. Executor é entrega separada.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RequestSyncRun'}
      responses:
        '202':
          description: Intenção registrada ou replay da execução existente; consultar status.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SyncRun'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Chave divergente, execução ativa, fonte indisponível ou conflito concorrente.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
    get:
      tags: [Accounting synchronization]
      operationId: listSynchronizations
      summary: Consulta histórico paginado da fonte autorizada.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/SyncRunStatus'}
      responses:
        '200':
          description: Página ordenada por solicitação decrescente e ID.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SyncRunPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/accounting-sources/{accountingSourceId}/sync-runs/{runId}:
    parameters:
      - $ref: '#/components/parameters/AccountingSourceId'
      - $ref: '#/components/parameters/SyncRunId'
    get:
      tags: [Accounting synchronization]
      operationId: getSynchronization
      summary: Consulta somente execução pertencente à fonte autorizada.
      responses:
        '200':
          description: Estado e métricas medidas; null não deve ser exibido como zero.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SyncRun'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [Accounting synchronization]
      operationId: cancelQueuedSynchronization
      summary: Cancela apenas REQUESTED; preserva execução, histórico e dados importados.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204': {description: Cancelada ou já CANCELLED.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Estado não cancelável ou conflito concorrente.}
  /api/accounting-sources/{accountingSourceId}/sync-runs/{runId}/events:
    parameters:
      - $ref: '#/components/parameters/AccountingSourceId'
      - $ref: '#/components/parameters/SyncRunId'
    get:
      tags: [Accounting synchronization]
      operationId: listSynchronizationEvents
      summary: Consulta snapshots de transição no mesmo escopo da execução.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Histórico paginado, sem payload contábil ou erro livre.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SyncRunEventPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/accounting-sources/{accountingSourceId}/sync-runs/{runId}/attempts:
    parameters:
      - $ref: '#/components/parameters/AccountingSourceId'
      - $ref: '#/components/parameters/SyncRunId'
    get:
      tags: [Accounting synchronization]
      operationId: listSynchronizationAttempts
      summary: Consulta tentativas e prazos, separadamente do ciclo geral da execução.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Tentativas mais recentes primeiro; exige QUESTOR_SYNC no mesmo escopo. Sem payload contábil ou erro livre.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SyncAttemptPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/admin/accounting-firms/{firmId}/connectors:
    parameters:
      - name: firmId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [Connector administration]
      operationId: listConnectorCredentials
      summary: Lista somente metadados; exige CONNECTOR_MANAGE explícito na contabilidade.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Metadados paginados sem segredo/hash, Cache-Control no-store.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConnectorCredentialPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Connector administration]
      operationId: issueConnectorCredential
      summary: Provisiona credencial de uma única fonte, com segredo mostrado uma vez.
      description: Exige CONNECTOR_MANAGE na contabilidade e QUESTOR_SYNC ALL na empresa. Reserva rota CONNECTOR sem execução ativa. Flag FINEMP_CONNECTOR_ENABLED; não recebe senhas ERP.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accountingSourceId, label]
              properties:
                accountingSourceId: {type: string, format: uuid}
                label: {type: string, minLength: 1, maxLength: 80}
      responses:
        '201':
          description: Segredo efêmero na resposta no-store; somente hash é persistido.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConnectorSecret'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Vínculo já existente ou execução ativa; nenhum segredo é repetido.}
  /api/admin/accounting-firms/{firmId}/connectors/{credentialId}:
    parameters:
      - name: firmId
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: credentialId
        in: path
        required: true
        schema: {type: string, format: uuid}
    delete:
      tags: [Connector administration]
      operationId: revokeConnectorCredential
      summary: Revoga idempotentemente, sem fallback para conexão direta.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204': {description: Credencial revogada; exige CONNECTOR_MANAGE na contabilidade.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/admin/accounting-firms/{firmId}/connectors/{credentialId}/rotate:
    parameters:
      - name: firmId
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: credentialId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: [Connector administration]
      operationId: rotateConnectorCredential
      summary: Invalida o segredo anterior e retorna um novo somente nesta resposta no-store.
      description: Exige novamente CONNECTOR_MANAGE e QUESTOR_SYNC ALL. Credencial revogada não pode ser reativada por rotação.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: Novo segredo; não há recuperação do segredo perdido.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConnectorSecret'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Credencial revogada.}
  /api/auth/access-catalog:
    get:
      tags: [Authentication]
      operationId: getAccessCatalog
      summary: Consulta metadados de permissões, não grants do usuário nem autorização.
      responses:
        '200':
          description: Catálogo versionado; presets indisponíveis não concedem capabilities.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccessCatalog'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/admin/accounting-firms/{firmId}/clients/{clientId}/companies/{companyId}/users:
    parameters:
      - name: firmId
        in: path
        required: true
        schema: {type: string, format: uuid}
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Identity administration]
      operationId: listCompanyUsers
      summary: Lista grants da empresa com autorização administrativa e cadeia pai/filho verificada.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Página de identidades resumidas, sem credenciais.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserAdministrationPage'}
        '400': {description: Paginação inválida.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/admin/accounting-firms/{firmId}/clients/{clientId}/companies/{companyId}/users/{userId}:
    parameters:
      - name: firmId
        in: path
        required: true
        schema: {type: string, format: uuid}
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Identity administration]
      operationId: getCompanyUserAccess
      summary: Consulta somente o grant da empresa autorizada.
      responses:
        '200':
          description: Permissões explícitas e rótulo/escopo do grant.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CompanyUserAccess'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Identity administration]
      operationId: replaceCompanyUserAccess
      summary: Substitui explicitamente um grant, sem inferir permissões por role.
      description: Exige USER_ACCESS_MANAGE na firma ou PLATFORM_USER_MANAGE global. Destinatário deve ter vínculo explícito na firma. RESTRICTED retorna 409 enquanto não houver filtro real.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetCompanyAccessRequest'}
      responses:
        '200':
          description: Grant atualizado; repetição idêntica não gera nova auditoria.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CompanyUserAccess'}
        '400': {description: Payload inválido.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Destinatário sem vínculo na firma ou escopo restrito ainda não suportado.}
    delete:
      tags: [Identity administration]
      operationId: revokeCompanyUserAccess
      summary: Remove somente este grant; preserva identidade e outros acessos.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204': {description: Grant removido ou já ausente.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/admin/accounting-firms/{firmId}/users:
    parameters:
      - name: firmId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [Identity administration]
      operationId: listAccountingFirmUsers
      summary: Lista membros com USER_ACCESS_MANAGE na firma ou PLATFORM_USER_MANAGE global.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Página de resumos sem credenciais nem permissões globais.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserAdministrationPage'}
        '400': {description: Paginação inválida.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/admin/accounting-firms/{firmId}/users/{userId}:
    parameters:
      - name: firmId
        in: path
        required: true
        schema: {type: string, format: uuid}
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Identity administration]
      operationId: getAccountingFirmUserAccess
      summary: Detalha somente o vínculo da contabilidade autorizada.
      responses:
        '200':
          description: Identidade resumida e permissões administrativas da firma.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FirmUserAccess'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Identity administration]
      operationId: replaceAccountingFirmUserPermissions
      summary: Substitui permissões sem conceder acesso financeiro.
      description: Gestor da firma altera membros existentes; administrador global pode associar identidade existente. Repetição idêntica é idempotente.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissions]
              properties:
                permissions:
                  type: array
                  uniqueItems: true
                  items: {$ref: '#/components/schemas/AccountingFirmPermission'}
      responses:
        '200':
          description: Vínculo atualizado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FirmUserAccess'}
        '400': {description: Payload inválido.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [Identity administration]
      operationId: revokeAccountingFirmUserAccess
      summary: Remove somente o vínculo administrativo, sem cascata financeira.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204': {description: Vínculo removido ou já ausente; identidade global preservada.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Revogar explicitamente os grants de empresas dessa contabilidade antes.}
  /api/admin/users:
    get:
      tags: [Identity administration]
      operationId: listPlatformUsers
      summary: Busca identidades globais com PLATFORM_USER_MANAGE explícita.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Página de resumos, sem credenciais ou coleções de permission.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserAdministrationPage'}
        '400': {description: Paginação inválida.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/admin/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Identity administration]
      operationId: getPlatformUser
      summary: Consulta identidade e permissões de plataforma, sem credenciais.
      responses:
        '200':
          description: Detalhe administrativo autorizado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserAdministrationDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/admin/users/{userId}/status:
    parameters:
      - $ref: '#/components/parameters/UserId'
    patch:
      tags: [Identity administration]
      operationId: setPlatformUserActive
      summary: Altera estado global, protegendo o último administrador ativo.
      description: Exige PLATFORM_USER_MANAGE. Não ativa marcador de convite sem senha definida. Incrementa versão das credenciais em mudança real.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties:
                active: {type: boolean}
      responses:
        '200':
          description: Estado atual da identidade; repetição sem mudança é idempotente.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserAdministrationSummary'}
        '400': {description: Payload inválido.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Último administrador ativo ou identidade sem senha definida pelo usuário.}
  /api/admin/users/{userId}/platform-permissions:
    parameters:
      - $ref: '#/components/parameters/UserId'
    put:
      tags: [Identity administration]
      operationId: replacePlatformPermissions
      summary: Substitui explicitamente permissões de plataforma, sem conceder grants financeiros.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissions]
              properties:
                permissions:
                  type: array
                  uniqueItems: true
                  items: {$ref: '#/components/schemas/PlatformPermission'}
      responses:
        '204': {description: Permissões atualizadas, ou já iguais; alteração real é auditada.}
        '400': {description: Payload inválido.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Tentativa de remover o último administrador ativo.}
  /api/auth/organization-access:
    get:
      tags: [Authentication]
      operationId: getCurrentOrganizationAccess
      summary: Consulta as permissões administrativas do próprio usuário autenticado.
      description: Identidade determinada somente pela sessão. Não concede nem lista dados financeiros de empresas.
      responses:
        '200':
          description: Permissões de plataforma e vínculos explícitos de contabilidade.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrganizationAccess'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/admin/accounting-firms:
    get:
      tags: [SaaS administration]
      operationId: listAccountingFirms
      summary: Consulta contabilidades com ACCOUNTING_FIRM_VIEW na plataforma.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Página de contabilidades.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountingFirmPage'}
        '400': {description: Paginação inválida.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [SaaS administration]
      operationId: createAccountingFirm
      summary: Cadastra contabilidade com ACCOUNTING_FIRM_CREATE na plataforma.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NameRequest'}
      responses:
        '201':
          description: Contabilidade criada ativa, sem grants financeiros implícitos.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountingFirm'}
        '400': {description: Cadastro inválido.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: Cadastro conflitante.}
  /api/accounting-firms/{accountingFirmId}/clients:
    parameters:
      - $ref: '#/components/parameters/AccountingFirmId'
    get:
      tags: [SaaS administration]
      operationId: listClients
      summary: Lista clientes com HIERARCHY_MANAGE na contabilidade.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Página de clientes no escopo.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClientPage'}
        '400': {description: Paginação inválida.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [SaaS administration]
      operationId: createClient
      summary: Cria cliente na contabilidade autorizada.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NameRequest'}
      responses:
        '201':
          description: Cliente criado ativo.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Client'}
        '400': {description: Cadastro inválido.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Cadastro conflitante.}
  /api/accounting-firms/{accountingFirmId}/clients/{clientId}/companies:
    parameters:
      - $ref: '#/components/parameters/AccountingFirmId'
      - $ref: '#/components/parameters/ClientId'
    get:
      tags: [SaaS administration]
      operationId: listClientCompanies
      summary: Lista empresas com HIERARCHY_MANAGE e relação contabilidade/cliente válida.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Página de empresas do cliente.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CompanyPage'}
        '400': {description: Paginação inválida.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [SaaS administration]
      operationId: createClientCompany
      summary: Cria empresa obrigatoriamente vinculada ao cliente autorizado.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateCompanyRequest'}
      responses:
        '201':
          description: Empresa criada, sem concessão automática de acesso financeiro.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Company'}
        '400': {description: Cadastro inválido.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Cadastro conflitante.}
  /api/accounting-firms/{accountingFirmId}/clients/{clientId}/companies/{companyId}/assignment:
    parameters:
      - $ref: '#/components/parameters/AccountingFirmId'
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/CompanyId'
    put:
      tags: [SaaS administration]
      operationId: assignUnlinkedCompany
      summary: Associa empresa legada sem cliente, com autorização dupla e auditoria.
      description: Exige UNASSIGNED_COMPANY_ASSIGN global e HIERARCHY_MANAGE no destino. Mesmo destino é idempotente; outro destino é rejeitado.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: Empresa vinculada ao cliente solicitado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Company'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Empresa já vinculada a outro cliente.}
  /api/accounting-firms/{accountingFirmId}/clients/{clientId}/companies/{companyId}/accounting-sources:
    parameters:
      - $ref: '#/components/parameters/AccountingFirmId'
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [SaaS administration]
      operationId: listCompanyAccountingSources
      summary: Lista fontes com ACCOUNTING_SOURCE_MANAGE e relações pai/filho válidas.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Página de fontes; busca por referência externa, sem secrets.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountingSourcePage'}
        '400': {description: Paginação inválida.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [SaaS administration]
      operationId: createCompanyAccountingSource
      summary: Cria fonte sem receber configuração de conexão ou credenciais.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateAccountingSourceRequest'}
      responses:
        '201':
          description: Fonte criada ativa; tipo atualmente suportado QUESTOR.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountingSource'}
        '400': {description: Cadastro inválido.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Cadastro conflitante.}
  /api/admin/accounting-firms/{firmId}/invitations:
    post:
      tags: [Identity administration]
      operationId: inviteAccountingFirmUser
      summary: Convida ou vincula uma identidade à contabilidade autorizada.
      description: Requer entrega habilitada e USER_ACCESS_MANAGE nessa contabilidade. Permissões solicitadas são aditivas; não concede acesso financeiro.
      parameters:
        - name: firmId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteFirmUserRequest'
      responses:
        '204':
          description: Operação concluída, sem token/senha na resposta e sem revelar a existência global do e-mail.
        '400':
          description: Formato de requisição inválido.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Contabilidade não encontrada no escopo autorizado ou entrega desabilitada.
        '429':
          description: Limite temporário de convites desse administrador excedido.
  /api/auth/csrf:
    get:
      tags: [Authentication]
      operationId: getCsrfToken
      summary: Obtém o token CSRF para operações mutáveis.
      security: []
      responses:
        '200':
          description: Token CSRF atual.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
  /api/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Inicia uma sessão autenticada.
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '204':
          description: Sessão iniciada. O cookie de sessão é enviado pelo servidor.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          description: Limite temporário de tentativas de login excedido; não desativa a conta.
  /api/auth/password-reset/request:
    post:
      tags: [Authentication]
      operationId: requestPasswordReset
      summary: Solicita um link de recuperação sem revelar existência da conta.
      description: Disponível somente com finemp.identity.mail.enabled=true e transporte configurado.
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '202':
          description: Resposta vazia e neutra, inclusive para endereço desconhecido, inativo ou limitado.
        '400':
          description: Formato de requisição inválido.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Funcionalidade de entrega desabilitada.
  /api/auth/password-reset/complete:
    post:
      tags: [Authentication]
      operationId: completePasswordReset
      summary: Redefine a senha usando link de recuperação de uso único.
      description: Requer entrega habilitada. Não inicia sessão; invalida sessões anteriores.
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteAccountActionRequest'
      responses:
        '204':
          description: Senha alterada. Obter novo CSRF e fazer login novamente.
        '400':
          description: Link inválido, expirado, consumido ou senha incompatível; sem detalhes sobre o token.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Funcionalidade de entrega desabilitada.
        '429':
          description: Limite temporário de tentativas excedido.
  /api/auth/activate:
    post:
      tags: [Authentication]
      operationId: activateInvitedAccount
      summary: Ativa uma identidade convidada e define sua senha.
      description: Requer entrega habilitada. O link não concede permissões financeiras nem inicia sessão.
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteAccountActionRequest'
      responses:
        '204':
          description: Identidade ativada; obter novo CSRF e iniciar sessão.
        '400':
          description: Convite inválido, expirado, consumido ou senha incompatível.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Funcionalidade de entrega desabilitada.
        '429':
          description: Limite temporário de tentativas excedido.
  /api/auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      summary: Retorna o usuário autenticado e seus acessos por empresa.
      responses:
        '200':
          description: Usuário e grants acessíveis.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Encerra e invalida a sessão atual.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Sessão encerrada.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/companies/{companyId}/accounting-movements:
    get:
      tags: [Accounting movements]
      operationId: listAccountingMovements
      summary: Lista movimentos contábeis de uma empresa em um período.
      description: Exige ACCOUNTING_MOVEMENT_VIEW e escopo ALL. DRE_VIEW não autoriza o razão bruto. A resposta atual ainda não possui paginação server-side.
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
      responses:
        '200':
          description: Movimentos no período inclusivo.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountingMovement'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/companies/{companyId}/accounting-accounts/classifications:
    get:
      tags: [Account classification]
      operationId: listAccountingAccountClassifications
      summary: Lista contas da empresa e o estado da classificação gerencial.
      description: Exige ACCOUNT_CLASSIFICATION_VIEW ou ACCOUNT_CLASSIFICATION_MANAGE na empresa e escopo ALL.
      parameters:
        - $ref: '#/components/parameters/CompanyId'
      responses:
        '200':
          description: Contas pendentes e classificadas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountingAccountClassification'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/companies/{companyId}/accounting-accounts/{accountId}/classification:
    put:
      tags: [Account classification]
      operationId: classifyAccountingAccount
      summary: Classifica ou reclassifica uma conta da empresa.
      description: Exige ACCOUNT_CLASSIFICATION_MANAGE na empresa e escopo de dados suportado; grant genérico não autoriza escrita.
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountingAccountClassificationRequest'
      responses:
        '204':
          description: Classificação aplicada.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/dre-classifications:
    get:
      tags: [Account classification]
      operationId: listDreClassifications
      summary: Lista o catálogo gerencial global de classificações DRE.
      responses:
        '200':
          description: Catálogo FINEMP.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DreClassification'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/companies/{companyId}/dre:
    get:
      tags: [DRE]
      operationId: calculateDre
      summary: Calcula a DRE inicial para a empresa e o período.
      description: Requer a permissão DRE_VIEW para a empresa solicitada.
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
      responses:
        '200':
          description: Linhas agregadas e quantidade de contas pendentes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DreCalculation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/accounting-sources/{accountingSourceId}/questor-import:
    post:
      tags: [Accounting synchronization]
      operationId: importQuestorAccountingMovements
      summary: Importa movimentos da fonte Questor para o FINEMP.
      description: |
        Operação administrativa disponível somente quando a integração Questor
        está habilitada. Não deve ser chamada durante uma leitura de tela.
        É desativada quando FINEMP_SYNC_EXECUTOR_ENABLED está habilitado;
        nesse modo, usar o controle SyncRun.
        O caminho legado de estudo não é publicado no perfil prod.
        Exige QUESTOR_SYNC na empresa proprietária da fonte, resolvida pelo servidor,
        e escopo ALL enquanto não houver segmentação de centro de custo.
        Valida fonte ativa, referência e período antes do adapter.
        CNPJ esperado não substitui comprovação da identidade externa;
        gate de produção multi-tenant ainda aberto.
      parameters:
        - name: accountingSourceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Importação concluída.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409': {description: Fonte inativa ou incompatível.}
        '502': {description: Leitura externa indisponível; dados anteriores preservados.}
        '422': {description: RESOURCE_LIMIT; solicitar período menor, sem resultado truncado.}
components:
  securitySchemes:
    ConnectorBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Segredo de máquina restrito a uma fonte, enviado somente via HTTPS em Authorization. Não é JWT nem credencial ERP.
    SessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: Sessão HTTP mantida em cookie HttpOnly.
  parameters:
    WithholdingEntryId:
      name: entryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WithholdingId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FinancialPeriodMonth:
      name: period
      in: path
      required: true
      schema:
        type: string
        pattern: ^(?!0000)[0-9]{4}-(0[1-9]|1[0-2])$
        description: Mês ISO entre0001-01 e9999-12.
    FinancialCommandKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, format: uuid}
      description: Chave única por Empresa e ator; mesma chave com outro conteúdo ou ação conflita. Reenvio exige permissão vigente.
    FinancialAsOfDate:
      name: asOfDate
      in: query
      schema: {type: string, format: date}
      description: Data explícita para classificar vencidos; ausente usa o calendário FINEMP_FINANCE_CALENDAR_ZONE (padrão America/Sao_Paulo). Datas ISO anos1–9999; não altera datas armazenadas.
    AccountingSourceId:
      name: accountingSourceId
      in: path
      required: true
      schema: {type: string, format: uuid}
    SyncRunId:
      name: runId
      in: path
      required: true
      schema: {type: string, format: uuid}
    UserId:
      name: userId
      in: path
      required: true
      schema: {type: string, format: uuid}
    AccountingFirmId:
      name: accountingFirmId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ClientId:
      name: clientId
      in: path
      required: true
      schema: {type: string, format: uuid}
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 0, default: 0}
    Size:
      name: size
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    Search:
      name: search
      in: query
      description: Busca textual por nome/razão social; nas fontes, referência externa; nas identidades, nome ou e-mail. Vazia inclui todos os registros do escopo.
      schema: {type: string, default: ''}
    CompanyId:
      name: companyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StartDate:
      name: startDate
      in: query
      required: true
      schema:
        type: string
        format: date
    EndDate:
      name: endDate
      in: query
      required: true
      schema:
        type: string
        format: date
    CsrfHeader:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: Valor obtido em `GET /api/auth/csrf`; o nome efetivo também é retornado pela API.
      schema:
        type: string
  responses:
    BankTransferConflict:
      description: Versão desatualizada, chave reutilizada com conteúdo/ação diferente, menos de duas contas ativas na criação ou conflito de integridade. Nenhuma alteração parcial.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/BankTransferCommandRejection'}
    BankTransferPayloadTooLarge:
      description: Corpo POST excede64KiB, inclusive sem Content-Length; nenhuma alteração.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/BankTransferCommandRejection'}
    BankTransferUnsupportedEncoding:
      description: POST aceita application/json sem compressão.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/BankTransferCommandRejection'}
    BankTransferBusy:
      description: Capacidade local de corpos em processamento esgotada; repetir com a mesma chave.
      headers:
        Retry-After: {schema: {type: string, examples: ['1']}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/BankTransferCommandRejection'}
    BankTransferUnavailable:
      description: Comando temporariamente indisponível; repetir com a mesma chave para recuperar eventual recibo confirmado.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/BankTransferCommandRejection'}
    FinancialEntryPayloadTooLarge:
      description: Corpo excede64KiB inclusive chunked; nenhuma gravação foi realizada.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/FinancialEntryCommandRejection'}
    FinancialEntryUnsupportedEncoding:
      description: Escrita aceita application/json sem compressão.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/FinancialEntryCommandRejection'}
    FinancialEntryBusy:
      description: Limite local de requisições com corpo em processamento; tentar novamente.
      headers:
        Retry-After: {schema: {type: string, examples: ['1']}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/FinancialEntryCommandRejection'}
    FinancialEntryUnavailable:
      description: Escrita temporariamente indisponível; sem diagnóstico interno. Repetir com a mesma chave para obter o recibo caso já tenha sido confirmada.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/FinancialEntryCommandRejection'}
    BadRequest:
      description: Requisição inválida.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthorized:
      description: Sessão ausente, expirada ou credenciais inválidas.
    Forbidden:
      description: Usuário autenticado sem grant, permission, data scope ou token CSRF válido.
    NotFound:
      description: Recurso não encontrado dentro do escopo autorizado.
  schemas:
    WithholdingInputValues:
      type: object
      additionalProperties: false
