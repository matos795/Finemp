openapi: 3.1.0
info:
  title: FINEMP API
  version: 0.1.0
  summary: Contrato headless inicial das operações implementadas no FINEMP.
  description: |
    Contrato da API já disponível. Cálculos e persistência de negócio pertencem
    ao backend. Os endpoints de reporting ainda não implementados não fazem
    parte deste documento.
servers:
  - url: http://localhost:8080
    description: Ambiente local
tags:
  - name: Authentication
  - name: Identity administration
  - name: SaaS administration
  - name: Accounting movements
  - name: Account classification
  - name: DRE
  - name: Accounting synchronization
  - name: Connector administration
  - name: Connector machine protocol
  - name: Financial bank accounts
paths:
  /api/companies/{companyId}/bank-accounts:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Financial bank accounts]
      operationId: listFinancialBankAccounts
      summary: Lista contas financeiras operacionais da empresa autorizada.
      description: Condicional a FINEMP_FINANCE_CATALOG_ENABLED. Exige BANK_ACCOUNT_VIEW ou BANK_ACCOUNT_MANAGE e escopo ALL. Não é plano contábil nem consulta Questor. Ordem estável por nome e UUID.
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - name: search
          in: query
          schema: {type: string, maxLength: 100, default: ''}
          description: Busca literal no nome, sem diferenciar maiúsculas. Percentual não é wildcard.
        - name: type
          in: query
          schema: {$ref: '#/components/schemas/FinancialBankAccountType'}
        - name: active
          in: query
          schema: {type: boolean}
      responses:
        '200':
          description: Página restrita à empresa.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FinancialBankAccountPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Financial bank accounts]
      operationId: createFinancialBankAccount
      summary: Cria conta operacional sem conceder acesso financeiro por papel administrativo.
      description: Exige BANK_ACCOUNT_MANAGE ALL, sessão e CSRF. Data e valores explícitos; saldo inicial não é saldo calculado. expectedVersion deve ser ausente ou null na criação.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FinancialBankAccountWrite'}
      responses:
        '201':
          description: Conta criada, com versão inicial zero.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FinancialBankAccount'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: Conflito de estado ou recurso ocupado; nenhuma escrita parcial.
  /api/companies/{companyId}/bank-accounts/{bankId}:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - name: bankId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [Financial bank accounts]
      operationId: getFinancialBankAccount
      summary: Consulta uma conta dentro da empresa autorizada.
      responses:
        '200':
          description: Conta financeira; abertura monetária como string decimal exata.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FinancialBankAccount'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Financial bank accounts]
      operationId: updateFinancialBankAccount
      summary: Substitui dados cadastrais sem alterar a empresa proprietária.
      description: Exige BANK_ACCOUNT_MANAGE ALL e expectedVersion atual. Resposta inclui a versão após flush; versão divergente retorna 409 STALE_VERSION.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/FinancialBankAccountWrite'
                - type: object
                  required: [expectedVersion]
                  properties:
                    expectedVersion: {type: integer, format: int64, minimum: 0}
      responses:
        '200':
          description: Dados persistidos e versão atualizada.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FinancialBankAccount'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Versão divergente, integridade ou transação incompatível; consultar estado atual.
    delete:
      tags: [Financial bank accounts]
      operationId: deleteFinancialBankAccount
      summary: Remove conta sem uso ou desativa histórico referenciado.
      description: Exige BANK_ACCOUNT_MANAGE ALL, versão atual e CSRF. Não remove a última linha sem referências, mesmo se inativa. Guardas de referências são fornecidas pelos módulos operacionais; integração real com lançamentos/transferências acompanha a entrega desses módulos. Nunca usa AccountingMovement como substituto.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: version
          in: query
          required: true
          schema: {type: integer, format: int64, minimum: 0}
      responses:
        '200':
          description: Ação aplicada; após DEACTIVATED consultar a conta para obter a nova versão.
          content:
            application/json:
              schema:
                type: object
                required: [id, action]
                properties:
                  id: {type: string, format: uuid}
                  action: {type: string, enum: [DELETED, DEACTIVATED]}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: STALE_VERSION, LAST_ACCOUNT, TRANSACTION_NOT_SUPPORTED ou BANK_ACCOUNT_CONFLICT.
  /api/connector/v1/work/{attemptId}/complete:
    parameters:
      - name: attemptId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: [Connector machine protocol]
      operationId: completeConnectorWork
      summary: Valida e publica um lote inteiro com autoridade e contexto reconstruídos no servidor.
      description: Parser fora de transação; publicação revalida credencial/versão/fonte/solicitante/lease/fence sob a mesma trava. Server mede counters. POST já encerrado retorna 409; consultar result para resolver resposta perdida. Identidade observada é declaração do agente, que deverá lê-la realmente no ERP.
      security:
        - ConnectorBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConnectorBatch'}
      responses:
        '200':
          description: Tentativa publicada; contas/movimentos/counters/sucesso/evento confirmados juntos.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConnectorWorkResult'}
        '202':
          description: Publicação revertida por falha transitória; tentativa falhou e retry foi agendado pelo lifecycle.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConnectorWorkResult'}
        '400': {description: Formato/JSON/campos inválidos; não altera a execução.}
        '401': {description: Credencial/transporte não autorizado.}
        '404': {description: Tentativa não pertence ao vínculo autenticado.}
        '409': {description: Tentativa encerrada, lease/fence não atual ou posse alterada; consultar result.}
        '413': {description: Orçamento de bytes/registros/estrutura excedido; não altera a execução.}
        '415': {description: Exige application/json sem Content-Encoding comprimido.}
        '422':
          description: Identidade/payload/conflito rejeitado ou orçamento de retries esgotado; dados anteriores preservados.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConnectorWorkResult'}
        '429': {description: Sem capacidade ou limite de autenticação; observar Retry-After.}
        '503': {description: Infraestrutura indisponível; consultar recibo antes de reenviar.}
  /api/connector/v1/work/{attemptId}/fail:
    parameters:
      - name: attemptId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: [Connector machine protocol]
      operationId: reportConnectorSourceFailure
      summary: Reporta código restrito de falha da origem, sem mensagem livre/status/counters.
      security:
        - ConnectorBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: {type: string, enum: [READ_FAILED, RESOURCE_LIMIT, IDENTITY_MISMATCH, INVALID_PAYLOAD]}
      responses:
        '202':
          description: Falha da tentativa registrada; retry limitado agendado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConnectorWorkResult'}
        '422':
          description: Falha terminal registrada, sem mutar movimentos.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConnectorWorkResult'}
        '400': {description: Formato/código inválido; não altera a execução.}
        '401': {description: Credencial/transporte não autorizado.}
        '404': {description: Tentativa não pertence ao vínculo autenticado.}
        '409': {description: Tentativa sem posse atual.}
        '413': {description: Orçamento de metadados excedido.}
        '415': {description: Exige application/json sem compressão.}
        '429': {description: Capacidade/limite de autenticação excedido.}
        '503': {description: Infraestrutura indisponível.}
  /api/connector/v1/work/{attemptId}/result:
    parameters:
      - name: attemptId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [Connector machine protocol]
      operationId: getConnectorWorkResult
      summary: Consulta recibo autoritativo da tentativa sem reenviar o lote.
      description: Mesmo vínculo e versão da credencial. Counters só são retornados quando esta tentativa teve sucesso; tentativa antiga falhada não recebe os counters de uma posterior. Não retorna linhas contábeis.
      security:
        - ConnectorBearer: []
      responses:
        '200':
          description: Estado e counters medidos, no-store.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConnectorWorkResult'}
        '400': {description: Identificador inválido.}
        '401': {description: Credencial/transporte não autorizado.}
        '404': {description: Tentativa não pertence ao vínculo autenticado.}
        '429': {description: Capacidade/limite de autenticação excedido.}
        '503': {description: Infraestrutura indisponível.}
  /api/connector/v1/work/claim:
    post:
      tags: [Connector machine protocol]
      operationId: claimConnectorWork
      summary: Obtém uma tentativa elegível exclusivamente da fonte vinculada ao bearer.
      description: Contexto/período vêm do servidor; não recebe SQL, empresa, fonte ou período escolhidos pelo agente. INITIAL apenas. Resposta perdida é recuperada após lease/backoff, com novo fence.
      security:
        - ConnectorBearer: []
      responses:
        '200':
          description: Tentativa e contexto atual, no-store; não há leitura ERP no servidor SaaS.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConnectorWork'}
        '400': {description: Corpo de requisição inválido, resposta sanitizada.}
        '413': {description: Orçamento de bytes do protocolo excedido.}
        '415': {description: Content-Encoding comprimido não é aceito.}
        '204': {description: Nenhum trabalho elegível agora; lease/backoff ou execução rejeitada pelo lifecycle.}
        '401': {description: Credencial ausente/inválida/revogada ou transporte sem TLS.}
        '429': {description: Limite de requisições; Retry-After 60s.}
        '503': {description: Infraestrutura temporariamente indisponível, sem erro livre.}
  /api/connector/v1/work/{attemptId}/heartbeat:
    parameters:
      - name: attemptId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: [Connector machine protocol]
      operationId: renewConnectorWork
      summary: Renova tentativa atual, com a mesma credencial/versão e fonte.
      description: Reconstrói contexto persistido. Não aceita extensão arbitrária, contadores ou período do agente. Rotação/revogação, perda de acesso ou lease vencido impedem renovação.
      security:
        - ConnectorBearer: []
      responses:
        '200':
          description: Novo prazo no-store, sem alterar o fence do run.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConnectorLease'}
        '413': {description: Orçamento de bytes do protocolo excedido.}
        '415': {description: Content-Encoding comprimido não é aceito.}
        '400': {description: Identificador inválido.}
        '401': {description: Credencial não vigente ou transporte sem TLS.}
        '404': {description: Tentativa não pertence ao vínculo autenticado.}
        '409': {description: Tentativa sem lease/fence atual ou acesso do solicitante removido.}
        '429': {description: Limite de requisições; Retry-After 60s.}
        '503': {description: Infraestrutura temporariamente indisponível, sem erro livre.}
  /api/connector/v1/session:
    get:
      tags: [Connector machine protocol]
      operationId: getConnectorMachineScope
      summary: Confere identidade de máquina vigente e retorna somente o vínculo de escopo.
      description: Exige HTTPS efetivo, FINEMP_CONNECTOR_ENABLED e FINEMP_CONNECTOR_PROTOCOL_ENABLED. Stateless; não aceita cookie como credencial, parâmetros de URL ou token em query. O servidor HTTP de desenvolvimento não atende este protocolo. Não executa nem publica lotes.
      security:
        - ConnectorBearer: []
      responses:
        '200':
          description: IDs e versão do vínculo, no-store, sem cookie/segredo/emissor ou dados contábeis.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConnectorMachineScope'}
        '400': {description: Corpo de requisição inválido, resposta sanitizada.}
        '413': {description: Orçamento de bytes do protocolo excedido.}
        '415': {description: Content-Encoding comprimido não é aceito.}
        '401':
          description: TLS ou credencial ausente/inválida/inativa, sempre sanitizado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConnectorProtocolError'}
        '429':
          description: Limite por endereço/credencial; Retry-After de 60 segundos.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConnectorProtocolError'}
        '503':
          description: Verificação temporariamente indisponível, sem detalhes internos.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConnectorProtocolError'}
  /api/accounting-sources/{accountingSourceId}/sync-runs:
    parameters:
      - $ref: '#/components/parameters/AccountingSourceId'
    post:
      tags: [Accounting synchronization]
      operationId: requestSynchronization
      summary: Registra intenção de sincronização; não lê ERP durante a requisição.
      description: Condicional a FINEMP_SYNC_CONTROL_ENABLED. Exige QUESTOR_SYNC na empresa da fonte e escopo ALL. Replay idêntico retorna a mesma execução, sem evento duplicado. Executor é entrega separada.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RequestSyncRun'}
      responses:
        '202':
          description: Intenção registrada ou replay da execução existente; consultar status.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SyncRun'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Chave divergente, execução ativa, fonte indisponível ou conflito concorrente.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
    get:
      tags: [Accounting synchronization]
      operationId: listSynchronizations
      summary: Consulta histórico paginado da fonte autorizada.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/SyncRunStatus'}
      responses:
        '200':
          description: Página ordenada por solicitação decrescente e ID.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SyncRunPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/accounting-sources/{accountingSourceId}/sync-runs/{runId}:
    parameters:
      - $ref: '#/components/parameters/AccountingSourceId'
      - $ref: '#/components/parameters/SyncRunId'
    get:
      tags: [Accounting synchronization]
      operationId: getSynchronization
      summary: Consulta somente execução pertencente à fonte autorizada.
      responses:
        '200':
          description: Estado e métricas medidas; null não deve ser exibido como zero.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SyncRun'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [Accounting synchronization]
      operationId: cancelQueuedSynchronization
      summary: Cancela apenas REQUESTED; preserva execução, histórico e dados importados.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204': {description: Cancelada ou já CANCELLED.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Estado não cancelável ou conflito concorrente.}
  /api/accounting-sources/{accountingSourceId}/sync-runs/{runId}/events:
    parameters:
      - $ref: '#/components/parameters/AccountingSourceId'
      - $ref: '#/components/parameters/SyncRunId'
    get:
      tags: [Accounting synchronization]
      operationId: listSynchronizationEvents
      summary: Consulta snapshots de transição no mesmo escopo da execução.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Histórico paginado, sem payload contábil ou erro livre.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SyncRunEventPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/accounting-sources/{accountingSourceId}/sync-runs/{runId}/attempts:
    parameters:
      - $ref: '#/components/parameters/AccountingSourceId'
      - $ref: '#/components/parameters/SyncRunId'
    get:
      tags: [Accounting synchronization]
      operationId: listSynchronizationAttempts
      summary: Consulta tentativas e prazos, separadamente do ciclo geral da execução.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Tentativas mais recentes primeiro; exige QUESTOR_SYNC no mesmo escopo. Sem payload contábil ou erro livre.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SyncAttemptPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/admin/accounting-firms/{firmId}/connectors:
    parameters:
      - name: firmId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [Connector administration]
      operationId: listConnectorCredentials
      summary: Lista somente metadados; exige CONNECTOR_MANAGE explícito na contabilidade.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Metadados paginados sem segredo/hash, Cache-Control no-store.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConnectorCredentialPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Connector administration]
      operationId: issueConnectorCredential
      summary: Provisiona credencial de uma única fonte, com segredo mostrado uma vez.
      description: Exige CONNECTOR_MANAGE na contabilidade e QUESTOR_SYNC ALL na empresa. Reserva rota CONNECTOR sem execução ativa. Flag FINEMP_CONNECTOR_ENABLED; não recebe senhas ERP.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accountingSourceId, label]
              properties:
                accountingSourceId: {type: string, format: uuid}
                label: {type: string, minLength: 1, maxLength: 80}
      responses:
        '201':
          description: Segredo efêmero na resposta no-store; somente hash é persistido.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConnectorSecret'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Vínculo já existente ou execução ativa; nenhum segredo é repetido.}
  /api/admin/accounting-firms/{firmId}/connectors/{credentialId}:
    parameters:
      - name: firmId
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: credentialId
        in: path
        required: true
        schema: {type: string, format: uuid}
    delete:
      tags: [Connector administration]
      operationId: revokeConnectorCredential
      summary: Revoga idempotentemente, sem fallback para conexão direta.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204': {description: Credencial revogada; exige CONNECTOR_MANAGE na contabilidade.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/admin/accounting-firms/{firmId}/connectors/{credentialId}/rotate:
    parameters:
      - name: firmId
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: credentialId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: [Connector administration]
      operationId: rotateConnectorCredential
      summary: Invalida o segredo anterior e retorna um novo somente nesta resposta no-store.
      description: Exige novamente CONNECTOR_MANAGE e QUESTOR_SYNC ALL. Credencial revogada não pode ser reativada por rotação.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: Novo segredo; não há recuperação do segredo perdido.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConnectorSecret'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Credencial revogada.}
  /api/auth/access-catalog:
    get:
      tags: [Authentication]
      operationId: getAccessCatalog
      summary: Consulta metadados de permissões, não grants do usuário nem autorização.
      responses:
        '200':
          description: Catálogo versionado; presets indisponíveis não concedem capabilities.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccessCatalog'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/admin/accounting-firms/{firmId}/clients/{clientId}/companies/{companyId}/users:
    parameters:
      - name: firmId
        in: path
        required: true
        schema: {type: string, format: uuid}
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Identity administration]
      operationId: listCompanyUsers
      summary: Lista grants da empresa com autorização administrativa e cadeia pai/filho verificada.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Página de identidades resumidas, sem credenciais.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserAdministrationPage'}
        '400': {description: Paginação inválida.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/admin/accounting-firms/{firmId}/clients/{clientId}/companies/{companyId}/users/{userId}:
    parameters:
      - name: firmId
        in: path
        required: true
        schema: {type: string, format: uuid}
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Identity administration]
      operationId: getCompanyUserAccess
      summary: Consulta somente o grant da empresa autorizada.
      responses:
        '200':
          description: Permissões explícitas e rótulo/escopo do grant.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CompanyUserAccess'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Identity administration]
      operationId: replaceCompanyUserAccess
      summary: Substitui explicitamente um grant, sem inferir permissões por role.
      description: Exige USER_ACCESS_MANAGE na firma ou PLATFORM_USER_MANAGE global. Destinatário deve ter vínculo explícito na firma. RESTRICTED retorna 409 enquanto não houver filtro real.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetCompanyAccessRequest'}
      responses:
        '200':
          description: Grant atualizado; repetição idêntica não gera nova auditoria.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CompanyUserAccess'}
        '400': {description: Payload inválido.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Destinatário sem vínculo na firma ou escopo restrito ainda não suportado.}
    delete:
      tags: [Identity administration]
      operationId: revokeCompanyUserAccess
      summary: Remove somente este grant; preserva identidade e outros acessos.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204': {description: Grant removido ou já ausente.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/admin/accounting-firms/{firmId}/users:
    parameters:
      - name: firmId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [Identity administration]
      operationId: listAccountingFirmUsers
      summary: Lista membros com USER_ACCESS_MANAGE na firma ou PLATFORM_USER_MANAGE global.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Página de resumos sem credenciais nem permissões globais.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserAdministrationPage'}
        '400': {description: Paginação inválida.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/admin/accounting-firms/{firmId}/users/{userId}:
    parameters:
      - name: firmId
        in: path
        required: true
        schema: {type: string, format: uuid}
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Identity administration]
      operationId: getAccountingFirmUserAccess
      summary: Detalha somente o vínculo da contabilidade autorizada.
      responses:
        '200':
          description: Identidade resumida e permissões administrativas da firma.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FirmUserAccess'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Identity administration]
      operationId: replaceAccountingFirmUserPermissions
      summary: Substitui permissões sem conceder acesso financeiro.
      description: Gestor da firma altera membros existentes; administrador global pode associar identidade existente. Repetição idêntica é idempotente.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissions]
              properties:
                permissions:
                  type: array
                  uniqueItems: true
                  items: {$ref: '#/components/schemas/AccountingFirmPermission'}
      responses:
        '200':
          description: Vínculo atualizado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FirmUserAccess'}
        '400': {description: Payload inválido.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [Identity administration]
      operationId: revokeAccountingFirmUserAccess
      summary: Remove somente o vínculo administrativo, sem cascata financeira.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204': {description: Vínculo removido ou já ausente; identidade global preservada.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Revogar explicitamente os grants de empresas dessa contabilidade antes.}
  /api/admin/users:
    get:
      tags: [Identity administration]
      operationId: listPlatformUsers
      summary: Busca identidades globais com PLATFORM_USER_MANAGE explícita.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Página de resumos, sem credenciais ou coleções de permission.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserAdministrationPage'}
        '400': {description: Paginação inválida.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/admin/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Identity administration]
      operationId: getPlatformUser
      summary: Consulta identidade e permissões de plataforma, sem credenciais.
      responses:
        '200':
          description: Detalhe administrativo autorizado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserAdministrationDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/admin/users/{userId}/status:
    parameters:
      - $ref: '#/components/parameters/UserId'
    patch:
      tags: [Identity administration]
      operationId: setPlatformUserActive
      summary: Altera estado global, protegendo o último administrador ativo.
      description: Exige PLATFORM_USER_MANAGE. Não ativa marcador de convite sem senha definida. Incrementa versão das credenciais em mudança real.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties:
                active: {type: boolean}
      responses:
        '200':
          description: Estado atual da identidade; repetição sem mudança é idempotente.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserAdministrationSummary'}
        '400': {description: Payload inválido.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Último administrador ativo ou identidade sem senha definida pelo usuário.}
  /api/admin/users/{userId}/platform-permissions:
    parameters:
