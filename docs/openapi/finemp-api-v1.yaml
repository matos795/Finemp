        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Página de contabilidades.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountingFirmPage'}
