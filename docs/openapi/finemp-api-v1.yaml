openapi: 3.1.0
info:
  title: FINEMP API
  version: 0.1.0
  summary: Contrato headless inicial das operações implementadas no FINEMP.
  description: |
    Contrato da API já disponível. Cálculos e persistência de negócio pertencem
    ao backend. Os endpoints de reporting ainda não implementados não fazem
    parte deste documento.
servers:
  - url: http://localhost:8080
    description: Ambiente local
tags:
  - name: Authentication
  - name: Identity administration
  - name: SaaS administration
  - name: Accounting movements
  - name: Account classification
  - name: DRE
  - name: Accounting synchronization
  - name: Connector administration
  - name: Connector machine protocol
  - name: Financial bank accounts
  - name: Business partners
  - name: Result centers
  - name: Financial categories
  - name: Financial entries
  - name: Financial bank transfers
  - name: Financial periods
  - name: Financial withholdings
paths:
  /api/companies/{companyId}/financial-entries/{entryId}/withholdings:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/WithholdingEntryId'
    get:
      tags:
        - Financial withholdings
      operationId: listFinancialWithholdings
      summary: Lista retenções informadas, sem agregação tributária.
      parameters:
        - name: treatment
          in: query
          schema:
            type: string
            enum:
              - PAYABLE
              - RECOVERABLE
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Dados autorizados da Company/lançamento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialWithholdingPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/FinancialEntryUnavailable'
    post:
      tags:
        - Financial withholdings
      operationId: createFinancialWithholding
      summary: Registra retenção explícita; Location aponta ao GET do recurso.
      description: >-
        Exige withholdings.enabled e os opt-ins de escrita financeira existentes (entries.enabled/entries.commands.enabled), FINANCIAL_ENTRY_MANAGE ALL vigente,
        sessão/CSRF e chave UUID. Reutiliza gate financeiro64KiB/4 concorrentes. Versões do pai/filho e competência atual são verificadas no backend. Nenhum
        cálculo tributário ou alteração de bruto/líquido.
      parameters:
        - $ref: '#/components/parameters/FinancialCommandKey'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithholdingCreateCommand'
      responses:
        '201':
          description: Recibo idempotente; DELETE informa última versão persistida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithholdingReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: STALE_ENTRY_VERSION, STALE_VERSION, IDEMPOTENCY_MISMATCH, FINANCIAL_PERIOD_CLOSED ou conflito de integridade.
        '413':
          $ref: '#/components/responses/FinancialEntryPayloadTooLarge'
        '415':
          $ref: '#/components/responses/FinancialEntryUnsupportedEncoding'
        '429':
          $ref: '#/components/responses/FinancialEntryBusy'
        '503':
          $ref: '#/components/responses/FinancialEntryUnavailable'
  /api/companies/{companyId}/financial-entries/{entryId}/withholdings/{id}:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/WithholdingEntryId'
      - $ref: '#/components/parameters/WithholdingId'
    get:
      tags:
        - Financial withholdings
      operationId: getFinancialWithholding
      summary: Consulta retenção por Company e lançamento.
      parameters: []
      responses:
        '200':
          description: Dados autorizados da Company/lançamento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialWithholding'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/FinancialEntryUnavailable'
    put:
      tags:
        - Financial withholdings
      operationId: updateFinancialWithholding
      summary: Altera somente valores informados da retenção.
      description: >-
        Exige withholdings.enabled e os opt-ins de escrita financeira existentes (entries.enabled/entries.commands.enabled), FINANCIAL_ENTRY_MANAGE ALL vigente,
        sessão/CSRF e chave UUID. Reutiliza gate financeiro64KiB/4 concorrentes. Versões do pai/filho e competência atual são verificadas no backend. Nenhum
        cálculo tributário ou alteração de bruto/líquido.
      parameters:
        - $ref: '#/components/parameters/FinancialCommandKey'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithholdingUpdateCommand'
      responses:
        '200':
          description: Recibo idempotente; DELETE informa última versão persistida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithholdingReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: STALE_ENTRY_VERSION, STALE_VERSION, IDEMPOTENCY_MISMATCH, FINANCIAL_PERIOD_CLOSED ou conflito de integridade.
        '413':
          $ref: '#/components/responses/FinancialEntryPayloadTooLarge'
        '415':
          $ref: '#/components/responses/FinancialEntryUnsupportedEncoding'
        '429':
          $ref: '#/components/responses/FinancialEntryBusy'
        '503':
          $ref: '#/components/responses/FinancialEntryUnavailable'
  /api/companies/{companyId}/financial-entries/{entryId}/withholdings/{id}/deletions:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/WithholdingEntryId'
      - $ref: '#/components/parameters/WithholdingId'
    post:
      tags:
        - Financial withholdings
      operationId: deleteFinancialWithholding
      summary: Remove retenção com precondições e histórico preservado.
      description: >-
        Exige withholdings.enabled e os opt-ins de escrita financeira existentes (entries.enabled/entries.commands.enabled), FINANCIAL_ENTRY_MANAGE ALL vigente,
        sessão/CSRF e chave UUID. Reutiliza gate financeiro64KiB/4 concorrentes. Versões do pai/filho e competência atual são verificadas no backend. Nenhum
        cálculo tributário ou alteração de bruto/líquido.
      parameters:
        - $ref: '#/components/parameters/FinancialCommandKey'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithholdingDeleteCommand'
      responses:
        '200':
          description: Recibo idempotente; DELETE informa última versão persistida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithholdingReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: STALE_ENTRY_VERSION, STALE_VERSION, IDEMPOTENCY_MISMATCH, FINANCIAL_PERIOD_CLOSED ou conflito de integridade.
        '413':
          $ref: '#/components/responses/FinancialEntryPayloadTooLarge'
        '415':
          $ref: '#/components/responses/FinancialEntryUnsupportedEncoding'
        '429':
          $ref: '#/components/responses/FinancialEntryBusy'
        '503':
          $ref: '#/components/responses/FinancialEntryUnavailable'
  /api/companies/{companyId}/financial-entries/{entryId}/withholdings/{id}/history:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/WithholdingEntryId'
      - $ref: '#/components/parameters/WithholdingId'
    get:
      tags:
        - Financial withholdings
      operationId: listFinancialWithholdingHistory
      summary: Diário oficial paginado, inclusive após exclusão do recurso/pai.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Dados autorizados da Company/lançamento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithholdingHistoryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/FinancialEntryUnavailable'
  /api/companies/{companyId}/financial-periods:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags:
        - Financial periods
      operationId: listFinancialPeriods
      summary: Lista somente meses persistidos; não precria estados abertos.
      parameters:
        - name: from
          in: query
          schema:
            type: string
            pattern: ^(?!0000)[0-9]{4}-(0[1-9]|1[0-2])$
            description: Mês ISO entre0001-01 e9999-12.
        - name: to
          in: query
          schema:
            type: string
            pattern: ^(?!0000)[0-9]{4}-(0[1-9]|1[0-2])$
            description: Mês ISO entre0001-01 e9999-12.
        - name: closed
          in: query
          schema:
            type: boolean
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Estado autorizado da Company.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialPeriodPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Indisponível; mensagem fixa sem SQL ou dados privados.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/companies/{companyId}/financial-periods/{period}:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/FinancialPeriodMonth'
    get:
      tags:
        - Financial periods
      operationId: getFinancialPeriod
      summary: Consulta mês; ausência significa aberto, id/version/atualização nulos.
      parameters: []
      responses:
        '200':
          description: Estado autorizado da Company.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialPeriod'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Indisponível; mensagem fixa sem SQL ou dados privados.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/companies/{companyId}/financial-periods/{period}/history:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/FinancialPeriodMonth'
    get:
      tags:
        - Financial periods
      operationId: listFinancialPeriodHistory
      summary: Histórico oficial do mês, paginado e restrito à Company.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Estado autorizado da Company.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialPeriodHistoryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Indisponível; mensagem fixa sem SQL ou dados privados.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/companies/{companyId}/financial-periods/{period}/closures:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/FinancialPeriodMonth'
    post:
      tags:
        - Financial periods
      operationId: closeFinancialPeriod
      summary: Fecha mês com FINANCIAL_PERIOD_CLOSE e versão esperada.
      description: >-
        Exige os dois opt-ins de períodos, sessão/CSRF, permissão específica ALL vigente e Idempotency-Key UUID. Autorização da rota normalizada precede o corpo
        limitado a64KiB, sem compressão, com concorrência4 compartilhada entre as duas ações. Estado, auditoria oficial e recibo são atômicos. Reenvio
        autorizado não repete efeitos.
      parameters:
        - $ref: '#/components/parameters/FinancialCommandKey'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinancialPeriodCloseCommand'
      responses:
        '200':
          description: Recibo imutável do comando; reenvio retorna o original.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialPeriodReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: STALE_VERSION, IDEMPOTENCY_MISMATCH, ALREADY_CLOSED, ALREADY_OPEN ou conflito concorrente.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '413':
          description: Corpo autorizado excede64KiB.
        '415':
          description: Conteúdo não JSON ou codificação não suportada.
        '429':
          description: Orçamento concorrente esgotado.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
        '503':
          description: Indisponível; mensagem fixa sem SQL ou dados privados.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/companies/{companyId}/financial-periods/{period}/reopenings:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/FinancialPeriodMonth'
    post:
      tags:
        - Financial periods
      operationId: reopenFinancialPeriod
      summary: Reabre mês com FINANCIAL_PERIOD_REOPEN e motivo obrigatório.
      description: >-
        Exige os dois opt-ins de períodos, sessão/CSRF, permissão específica ALL vigente e Idempotency-Key UUID. Autorização da rota normalizada precede o corpo
        limitado a64KiB, sem compressão, com concorrência4 compartilhada entre as duas ações. Estado, auditoria oficial e recibo são atômicos. Reenvio
        autorizado não repete efeitos.
      parameters:
        - $ref: '#/components/parameters/FinancialCommandKey'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinancialPeriodReopenCommand'
      responses:
        '200':
          description: Recibo imutável do comando; reenvio retorna o original.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialPeriodReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: STALE_VERSION, IDEMPOTENCY_MISMATCH, ALREADY_CLOSED, ALREADY_OPEN ou conflito concorrente.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '413':
          description: Corpo autorizado excede64KiB.
        '415':
          description: Conteúdo não JSON ou codificação não suportada.
        '429':
          description: Orçamento concorrente esgotado.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
        '503':
          description: Indisponível; mensagem fixa sem SQL ou dados privados.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/companies/{companyId}/financial-entry-series/monthly:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    post:
      tags: [Financial entries]
      operationId: createMonthlyEntrySeries
      summary: Cria um conjunto mensal canônico e retorna seu recibo ordenado.
      description: Mesmos opt-ins, MANAGE ALL vigente, sessão/CSRF, chave UUID e limite de corpo da escrita individual. Reutiliza valores positivos exatos; repete valor, preserva datas homologadas e pagamento apenas na primeira ocorrência. Não é parcelamento nem agendamento automático. Reenvio retorna o conjunto original, mesmo após exclusões. Meses financeiros afetados são validados no servidor; fechado retorna409 FINANCIAL_PERIOD_CLOSED. Replay autorizado retorna o recibo sem repetir efeitos.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/FinancialCommandKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MonthlyEntryCreateCommand'}
      responses:
        '201':
          description: Recibo imutável com posições/IDs/versões originais.
          headers:
            Location: {schema: {type: string}, description: GET da primeira ocorrência original; pode estar removida em reenvio posterior.}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EntrySeriesCommandReceipt'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: Chave reutilizada com conteúdo/ação diferente ou conflito de integridade; sem efeitos parciais.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/FinancialEntryCommandRejection'}
        '413': {$ref: '#/components/responses/FinancialEntryPayloadTooLarge'}
        '415': {$ref: '#/components/responses/FinancialEntryUnsupportedEncoding'}
        '429': {$ref: '#/components/responses/FinancialEntryBusy'}
        '503': {$ref: '#/components/responses/FinancialEntryUnavailable'}
  /api/companies/{companyId}/bank-transfers:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Financial bank transfers]
      operationId: listBankTransfers
      summary: Consulta transferências internas da Empresa com paginação no servidor.
      description: FINEMP_FINANCE_TRANSFERS_ENABLED e BANK_ACCOUNT_VIEW ou MANAGE ALL vigente. Ordem por data decrescente e UUID. Sem cálculos de saldo; escrita exige opt-in adicional próprio.
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: Página de transferências com nomes atuais das duas contas.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BankTransferPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503':
          description: Consulta temporariamente indisponível; mensagem sem detalhes internos.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
    post:
      tags: [Financial bank transfers]
      operationId: createBankTransfer
      summary: Cria uma transferência interna com recibo idempotente.
      description: Exige FINEMP_FINANCE_TRANSFERS_ENABLED e FINEMP_FINANCE_TRANSFER_COMMANDS_ENABLED, BANK_ACCOUNT_MANAGE ALL vigente, sessão e CSRF. Corpo limitado64KiB, JSON sem compressão, até quatro corpos em processamento por instância. Referências isoladas e pelo menos duas contas ativas; valor positivo canônico sem arredondamento. Não executa operação bancária externa. Meses financeiros afetados são validados no servidor; fechado retorna409 FINANCIAL_PERIOD_CLOSED. Replay autorizado retorna o recibo sem repetir efeitos.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BankTransferCreateCommand'}
      responses:
        '201':
          description: Recibo original da criação, inclusive em reenvio após exclusão.
          headers:
            Location: {schema: {type: string}, description: URL do recurso criado; pode retornar404 se já removido posteriormente.}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BankTransferCommandReceipt'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/BankTransferConflict'}
        '413': {$ref: '#/components/responses/BankTransferPayloadTooLarge'}
        '415': {$ref: '#/components/responses/BankTransferUnsupportedEncoding'}
        '429': {$ref: '#/components/responses/BankTransferBusy'}
        '503': {$ref: '#/components/responses/BankTransferUnavailable'}
  /api/companies/{companyId}/bank-transfers/{transferId}:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - name: transferId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [Financial bank transfers]
      operationId: getBankTransfer
      summary: Consulta uma transferência da Empresa autorizada.
      description: Mesmo opt-in e permissão da coleção. UUID ausente ou pertencente a outra Empresa retorna404; Empresa sem permissão retorna403.
      responses:
        '200':
          description: Projeção atual, sem identidade de usuário ou auditoria privada.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BankTransferRead'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503':
          description: Consulta temporariamente indisponível.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
    delete:
      tags: [Financial bank transfers]
      operationId: deleteBankTransfer
      summary: Exclui uma transferência com versão esperada e recibo persistente.
      description: Mesmos opt-ins, sessão/CSRF e MANAGE ALL da criação. Sem corpo; versão vem da query. Recibo DELETED registra a última versão persistida. Reenvio com a mesma chave/versão devolve o recibo original após exclusão, sem repetir efeitos. Meses financeiros afetados são validados no servidor; fechado retorna409 FINANCIAL_PERIOD_CLOSED. Replay autorizado retorna o recibo sem repetir efeitos.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, format: uuid}
        - name: expectedVersion
          in: query
          required: true
          schema: {type: integer, format: int64, minimum: 0}
      responses:
        '200':
          description: Recibo imutável da exclusão; consulta atual é separada.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BankTransferCommandReceipt'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/BankTransferConflict'}
        '503': {$ref: '#/components/responses/BankTransferUnavailable'}
  /api/companies/{companyId}/financial-entries:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Financial entries]
      operationId: listFinancialEntries
      summary: Consulta lançamentos operacionais autorizados com filtros no servidor.
      description: FINEMP_FINANCE_ENTRIES_ENABLED e FINANCIAL_ENTRY_VIEW ou MANAGE ALL explícitos. Rótulos financeiros mínimos não concedem acesso ao perfil completo do parceiro. Ordem por pagamento quando presente ou vencimento, depois UUID. Sem somatórios de páginas incompletas no cliente; escrita exige opt-in adicional próprio.
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - name: from
          in: query
          schema: {type: string, format: date}
          description: Início inclusivo da data de pagamento, se presente; caso contrário vencimento.
        - name: to
          in: query
          schema: {type: string, format: date}
          description: Fim inclusivo da mesma data de referência; não pode anteceder from.
        - name: direction
          in: query
          schema: {$ref: '#/components/schemas/FinancialDirection'}
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/FinancialEntryReadStatus'}
          description: OPEN inclui todos sem pagamento; OVERDUE restringe aos anteriores a asOfDate; PAID exige data de pagamento mesmo se futura.
        - name: bankId
          in: query
          schema: {type: string, format: uuid}
        - name: categoryId
          in: query
          schema: {type: string, format: uuid}
          description: Categoria ou grupo com suas subcategorias.
        - name: partnerId
          in: query
          schema: {type: string, format: uuid}
        - name: centerId
          in: query
          schema: {type: string, format: uuid}
          description: Raiz da subárvore da mesma Empresa; desconhecida retorna404 sem remover o filtro.
        - name: withoutCenter
          in: query
          schema: {type: boolean, default: false}
          description: Somente sem centro; não combinar com centerId.
        - name: costBehavior
          in: query
          schema: {$ref: '#/components/schemas/CostBehavior'}
          description: Classificação efetiva com override do lançamento antes da categoria/grupo/padrão.
        - name: search
          in: query
          schema: {type: string, maxLength: 100, default: ''}
          description: Busca literal sem diferença de caixa sobre descrição, rótulo/documento do parceiro, documento, observação e nome da categoria. Acentos são preservados.
        - $ref: '#/components/parameters/FinancialAsOfDate'
      responses:
        '200':
          description: Página tenant-scoped, com valores e classificação calculados pelo backend.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FinancialEntryPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503':
          description: Consulta temporariamente indisponível ou excedeu orçamento SQL; sem diagnóstico interno.
    post:
      tags: [Financial entries]
      operationId: createFinancialEntry
      summary: Cria um lançamento individual canônico com recibo idempotente.
      description: Exige FINEMP_FINANCE_ENTRIES_ENABLED e FINEMP_FINANCE_ENTRY_COMMANDS_ENABLED, MANAGE ALL vigente, sessão e CSRF. Contrato limitado a valor positivo já exato em centavos, enviado como texto; não decide normalização bruta/subcentavo ou séries da Issue128. Chave por Empresa/ator, compartilhada entre ações. Replay autorizado retorna recibo original e status201; estado atual é consultado por GET. Corpo JSON estrito até64KiB, sem compressão, inclusive chunked. Gravação do lançamento, recibo e evento antes/depois é atômica. Meses financeiros afetados são validados no servidor; fechado retorna409 FINANCIAL_PERIOD_CLOSED. Replay autorizado retorna o recibo sem repetir efeitos.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/FinancialCommandKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FinancialEntryCreateCommand'}
      responses:
        '201':
          description: Recibo imutável do comando original ou reenvio; Location indica o GET do lançamento.
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FinancialEntryCommandReceipt'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: Chave reutilizada com outro conteúdo/ação ou conflito de integridade/concorrência; sem gravação parcial.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/FinancialEntryCommandRejection'}
        '413': {$ref: '#/components/responses/FinancialEntryPayloadTooLarge'}
        '415': {$ref: '#/components/responses/FinancialEntryUnsupportedEncoding'}
        '429': {$ref: '#/components/responses/FinancialEntryBusy'}
        '503': {$ref: '#/components/responses/FinancialEntryUnavailable'}
  /api/companies/{companyId}/financial-entries/{entryId}:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - name: entryId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [Financial entries]
      operationId: getFinancialEntry
      summary: Consulta lançamento operacional da Empresa com VIEW ou MANAGE ALL.
      parameters:
        - $ref: '#/components/parameters/FinancialAsOfDate'
      responses:
        '200':
          description: Estado e rótulos financeiros mínimos; não expõe perfil ou atores de auditoria.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FinancialEntryRead'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503':
          description: Consulta temporariamente indisponível; sem diagnóstico interno.
    put:
      tags: [Financial entries]
      operationId: updateFinancialEntry
      summary: Altera lançamento individual com versão esperada e recibo idempotente.
      description: Mesmos opt-ins, MANAGE ALL vigente, sessão/CSRF e limites do POST. Subcategoria e referências pertencem à Empresa. Valor efetivamente pago é preservado se continuar pago e limpo se paymentDate for null; não é recebido do cliente. Centro obrigatório configurável se aplica somente à criação. Reenvio autorizado retorna o recibo original antes de revalidar referências alteradas posteriormente. Versão esperada divergente é409, inclusive zero é versão válida. Meses financeiros afetados são validados no servidor; fechado retorna409 FINANCIAL_PERIOD_CLOSED. Replay autorizado retorna o recibo sem repetir efeitos.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/FinancialCommandKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FinancialEntryUpdateCommand'}
      responses:
        '200':
          description: Recibo imutável da alteração ou reenvio; consultar GET para estado atual.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FinancialEntryCommandReceipt'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: STALE_VERSION, IDEMPOTENCY_MISMATCH ou conflito de integridade; consultar estado atual.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/FinancialEntryCommandRejection'}
        '413': {$ref: '#/components/responses/FinancialEntryPayloadTooLarge'}
        '415': {$ref: '#/components/responses/FinancialEntryUnsupportedEncoding'}
        '429': {$ref: '#/components/responses/FinancialEntryBusy'}
        '503': {$ref: '#/components/responses/FinancialEntryUnavailable'}
    delete:
      tags: [Financial entries]
      operationId: deleteFinancialEntry
      summary: Exclui lançamento financeiro individual com versão e recibo idempotente.
      description: Exige os dois opt-ins de lançamentos, FINANCIAL_ENTRY_MANAGE ALL vigente, sessão/CSRF e chave UUID. Sem corpo. Remove a raiz e futuras ocorrências da mesma série ainda sem pagamento e com vencimento atual estritamente maior que o alvo; preserva pagas futuras e posições originais. Recibo DELETED mantém última versão da raiz e deletedEntries efetivas. Reenvio recupera o conjunto original. Lotes/estoque têm contratos próprios. Meses financeiros afetados são validados no servidor; fechado retorna409 FINANCIAL_PERIOD_CLOSED. Replay autorizado retorna o recibo sem repetir efeitos.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/FinancialCommandKey'
        - name: expectedVersion
          in: query
          required: true
          schema: {type: integer, format: int64, minimum: 0}
      responses:
        '200':
          description: Recibo imutável da exclusão individual; não representa recurso ainda existente.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FinancialEntryCommandReceipt'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Versão/chave conflitante ou integridade; sem efeitos parciais.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/FinancialEntryCommandRejection'}
        '503': {$ref: '#/components/responses/FinancialEntryUnavailable'}
  /api/companies/{companyId}/financial-entries/{entryId}/settlements:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - name: entryId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: [Financial entries]
      operationId: settleFinancialEntry
      summary: Registra baixa financeira individual com data, conta e valor efetivo.
      description: Exige os dois opt-ins de escrita financeira, MANAGE ALL vigente, sessão/CSRF, chave idempotente e versão esperada. Valor textual positivo já exato em centavos; não decide captura bruta128. Marca o título como pago, mantém nominal e classificadores e atualiza a conta. Valor igual ao nominal remove override; diferença fica no efetivo. Reaplicação autorizada usa versão atual. Corpo64KiB, sem compressão e com orçamento compartilhado de concorrência, inclusive URI codificado. Não movimenta dinheiro por serviço bancário externo nem grava no Questor. Meses financeiros afetados são validados no servidor; fechado retorna409 FINANCIAL_PERIOD_CLOSED. Replay autorizado retorna o recibo sem repetir efeitos.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/FinancialCommandKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FinancialEntrySettlementCommand'}
      responses:
        '200':
          description: Recibo original imutável, inclusive em reenvio; GET fornece o estado atual.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FinancialEntryCommandReceipt'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Versão desatualizada, chave com outro conteúdo/ação ou conflito de integridade; sem gravação parcial.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/FinancialEntryCommandRejection'}
        '413': {$ref: '#/components/responses/FinancialEntryPayloadTooLarge'}
        '415': {$ref: '#/components/responses/FinancialEntryUnsupportedEncoding'}
        '429': {$ref: '#/components/responses/FinancialEntryBusy'}
        '503': {$ref: '#/components/responses/FinancialEntryUnavailable'}
  /api/companies/{companyId}/financial-entries/{entryId}/settlement-reversals:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - name: entryId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: [Financial entries]
      operationId: reverseFinancialEntrySettlement
      summary: Estorna a baixa financeira e conserva a última conta selecionada.
      description: Mesmos opt-ins, autorização, CSRF, idempotência e limites da baixa. Recebe apenas expectedVersion. Limpa pagamento e valor efetivo informado, conservando nominal, conta e classificadores. Registro já aberto pode produzir recibo/evento sem mudança de versão. Reenvio retorna o recibo original e não reaplica alteração, exigindo permissão vigente. Meses financeiros afetados são validados no servidor; fechado retorna409 FINANCIAL_PERIOD_CLOSED. Replay autorizado retorna o recibo sem repetir efeitos.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/FinancialCommandKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FinancialEntrySettlementReversalCommand'}
      responses:
        '200':
          description: Recibo imutável do comando original, inclusive em reenvio.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FinancialEntryCommandReceipt'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Versão, chave idempotente ou integridade conflitante; consultar estado atual.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/FinancialEntryCommandRejection'}
        '413': {$ref: '#/components/responses/FinancialEntryPayloadTooLarge'}
        '415': {$ref: '#/components/responses/FinancialEntryUnsupportedEncoding'}
        '429': {$ref: '#/components/responses/FinancialEntryBusy'}
        '503': {$ref: '#/components/responses/FinancialEntryUnavailable'}
  /api/companies/{companyId}/financial-categories:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Financial categories]
      operationId: listFinancialCategories
      summary: Lista grupos e subcategorias operacionais com classificação efetiva.
      description: FINEMP_FINANCE_CATALOG_ENABLED e FINANCIAL_CATEGORY_VIEW ou MANAGE ALL. Classificação calculada no servidor; plano operacional distinto de AccountingAccount/PlanoQ. Ordem hierárquica numérica.
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - name: search
          in: query
          schema: {type: string, maxLength: 100, default: ''}
          description: Nome sem acentos/caixa ou código; busca literal.
        - name: direction
          in: query
          schema: {$ref: '#/components/schemas/FinancialDirection'}
        - name: kind
          in: query
          schema: {type: string, enum: [GROUP, SUBCATEGORY]}
        - name: parentId
          in: query
          schema: {type: string, format: uuid}
          description: Grupo da mesma Empresa, para listar somente suas subcategorias.
      responses:
        '200':
          description: Página com classificações brutas e efetivas.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FinancialCategoryPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/companies/{companyId}/financial-categories/standard-plan:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    post:
      tags: [Financial categories]
      operationId: createStandardFinancialCategoryPlan
      summary: Inicializa explicitamente os metadados do plano homologado em uma Empresa sem categorias.
      description: Exige FINANCIAL_CATEGORY_MANAGE ALL, sessão/CSRF e flag financeira. Somente plano integralmente vazio; não mescla nem sobrescreve cadastros. Onze grupos e sessenta subcategorias, sem lançamentos/valores. DRE das subs padrão é explícita na criação, diferente do addSub manual. Comando atômico e serializado com os cadastros; falha desfaz todo o plano.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '201':
          description: Plano persistido; classificação continua calculada no backend.
          content:
            application/json:
              schema:
                type: object
                required: [version, groups, subcategories]
                properties:
                  version: {type: string, const: FINEMP_WEB_1}
                  groups: {type: integer, const: 11}
                  subcategories: {type: integer, const: 60}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: PLAN_NOT_EMPTY ou conflito de concorrência; não publica plano parcial.
  /api/companies/{companyId}/financial-categories/groups:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    post:
      tags: [Financial categories]
      operationId: createFinancialCategoryGroup
      summary: Cria grupo e uma subcategoria inicial atomicamente.
      description: MANAGE ALL e CSRF. Código gerado no servidor por direção; atividade operacional, DRE REC entrada/DADM saída. Custo efetivo variável entrada/fixo saída. Inicial Nova subcategoria herda campos ausentes. Nome pode ser informado na mesma operação do cadastro.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [direction, name]
              properties:
                direction: {$ref: '#/components/schemas/FinancialDirection'}
                name: {type: string, minLength: 1, maxLength: 255}
      responses:
        '201':
          description: Grupo criado com versão zero; sub inicial disponível na lista.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FinancialCategory'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: Sequência esgotada ou conflito concorrente; não publica grupo parcial.
  /api/companies/{companyId}/financial-categories/{groupId}/subcategories:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - name: groupId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: [Financial categories]
      operationId: createFinancialSubcategory
      summary: Cria subcategoria com código automático e overrides inicialmente ausentes.
      description: MANAGE ALL e CSRF. Pai deve ser grupo da Empresa. Não permite terceiro nível. Classificações ausentes usam fallback dinâmico do grupo.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 255}
      responses:
        '201':
          description: Subcategoria criada.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FinancialCategory'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: NOT_A_GROUP, SEQUENCE_EXHAUSTED ou conflito concorrente.
  /api/companies/{companyId}/financial-categories/{categoryId}:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - name: categoryId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [Financial categories]
      operationId: getFinancialCategory
      summary: Consulta categoria com VIEW ou MANAGE ALL.
      responses:
        '200':
          description: Classificações brutas e efetivas.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FinancialCategory'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Financial categories]
      operationId: updateFinancialCategory
      summary: Atualiza classificação sem alterar código, pai ou direção.
      description: MANAGE ALL. Grupo exige atividade e DRE explícitas; custo null usa padrão da direção. Subcategoria aceita atividade/custo null para herdar, e DRE null para fotografar o valor atual do grupo, conforme handler homologado. Não é troca silenciosa entre herança e fotografia.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, expectedVersion]
              properties:
                name: {type: string, minLength: 1, maxLength: 255}
                cashActivity:
                  anyOf:
                    - $ref: '#/components/schemas/CashActivity'
                    - type: 'null'
                dreLine:
                  anyOf:
                    - $ref: '#/components/schemas/OperationalDreLine'
                    - type: 'null'
                costBehavior:
                  anyOf:
                    - $ref: '#/components/schemas/CostBehavior'
                    - type: 'null'
                expectedVersion: {type: integer, format: int64, minimum: 0}
      responses:
        '200':
          description: Classificação e versão após flush.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FinancialCategory'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: STALE_VERSION ou conflito concorrente.
    delete:
      tags: [Financial categories]
      operationId: deleteFinancialCategory
      summary: Remove categoria sem uso; grupo inclui seus filhos na mesma transação.
      description: MANAGE ALL e versão exata. Uso por lançamento na categoria ou em subcategorias recusa exclusão. Não desativa. Adapter operacional real depende39; constraints protegem referências físicas existentes.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: version
          in: query
          required: true
          schema: {type: integer, format: int64, minimum: 0}
      responses:
        '204':
          description: Removido sem referências.
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: CATEGORY_IN_USE, STALE_VERSION ou conflito físico/concorrente.
  /api/companies/{companyId}/result-centers:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Result centers]
      operationId: listResultCenters
      summary: Consulta centros operacionais em ordem hierárquica.
      description: Exige RESULT_CENTER_VIEW ou MANAGE ALL e FINEMP_FINANCE_CATALOG_ENABLED. Ordem numérica por segmentos, sem confundir 1.1 com 1.10. hasChildren considera todos os filhos, independentemente dos filtros.
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - name: search
          in: query
          schema: {type: string, maxLength: 100, default: ''}
          description: Nome sem acentos/caixa ou código, de forma literal.
        - name: active
          in: query
          schema: {type: boolean}
        - name: rootId
          in: query
          schema: {type: string, format: uuid}
          description: Centro da mesma Empresa; inclui a raiz e toda sua subárvore.
      responses:
        '200':
          description: Página de centros da Empresa.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResultCenterPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Result centers]
      operationId: createResultCenter
      summary: Cria centro ativo com código hierárquico imutável.
      description: MANAGE ALL. Remove espaços do código; até20 caracteres numéricos separados por ponto. Pai exato deve existir na Empresa. type GROUP ou ANALYTICAL obrigatório; filhos não alteram o tipo do pai. Não reclassifica dados anteriores.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, type]
              properties:
                code: {type: string, maxLength: 100, description: Até20 caracteres após remover espaços.}
                name: {type: string, minLength: 2, maxLength: 80}
                type: {type: string, enum: [GROUP, ANALYTICAL]}
      responses:
        '201':
          description: Centro criado com versão zero.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResultCenter'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: DUPLICATE_CODE, PARENT_NOT_FOUND ou conflito concorrente.
  /api/companies/{companyId}/result-centers/{centerId}:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - name: centerId
