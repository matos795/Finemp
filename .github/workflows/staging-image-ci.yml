name: Staging image CI
on:
  pull_request:
    paths:
      - 'backend/Dockerfile'
      - 'backend/.dockerignore'
      - 'backend/railway.toml'
      - 'backend/pom.xml'
      - 'backend/src/main/java/com/finemp/staging/**'
      - 'backend/src/main/resources/application-staging.yml'
      - '.github/workflows/staging-image-ci.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build API runtime
        run: docker build --tag finemp-staging:test backend
      - name: Verify non-root runtime and early staging guard
        shell: bash
        run: |
          test "$(docker run --rm --entrypoint id finemp-staging:test -u)" = "10001"
          set +e
          docker run --rm -e SPRING_PROFILES_ACTIVE=staging finemp-staging:test > staging-startup.log 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          grep -q 'Staging configuration rejected: profiles' staging-startup.log
