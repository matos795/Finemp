name: Reference contract CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/reference/**'
      - 'docs/reference/**'
      - '.github/workflows/reference-contract-ci.yml'
  push:
    branches: [main]
    paths:
      - 'tools/reference/**'
      - 'docs/reference/**'
      - '.github/workflows/reference-contract-ci.yml'

permissions:
  contents: read

jobs:
  verify-reference-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/reference/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: tools/reference
      - run: npm test
        working-directory: tools/reference
