spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/finemp
    username: finemp
    password: ${FINEMP_LOCAL_DB_PASSWORD}
    
finemp:
  local-user:
    enabled: ${FINEMP_LOCAL_USER_ENABLED:false}
    name: ${FINEMP_LOCAL_USER_NAME:Usuário Local}
    email: ${FINEMP_LOCAL_USER_EMAIL:}
    password: ${FINEMP_LOCAL_USER_PASSWORD:}
    company-id: ${FINEMP_LOCAL_COMPANY_ID:}