spring:
  application:
    name: finemp-api

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

finemp:
  finance:
    catalog:
      enabled: ${FINEMP_FINANCE_CATALOG_ENABLED:false}
    entries:
      enabled: ${FINEMP_FINANCE_ENTRIES_ENABLED:false}
      calendar-zone: ${FINEMP_FINANCE_CALENDAR_ZONE:America/Sao_Paulo}
  connector:
    enabled: ${FINEMP_CONNECTOR_ENABLED:false}
    credential-lifetime-days: ${FINEMP_CONNECTOR_CREDENTIAL_LIFETIME_DAYS:90}
    protocol:
      enabled: ${FINEMP_CONNECTOR_PROTOCOL_ENABLED:false}
      max-batch-bytes: ${FINEMP_CONNECTOR_MAX_BATCH_BYTES:8388608}
      max-metadata-bytes: ${FINEMP_CONNECTOR_MAX_METADATA_BYTES:2048}
      max-concurrent-requests: ${FINEMP_CONNECTOR_MAX_CONCURRENT_REQUESTS:2}
      rate-limit:
        capacity: ${FINEMP_CONNECTOR_AUTH_CAPACITY:10000}
        address-per-minute: ${FINEMP_CONNECTOR_AUTH_ADDRESS_PER_MINUTE:600}
        credential-per-minute: ${FINEMP_CONNECTOR_AUTH_CREDENTIAL_PER_MINUTE:120}
  sync:
    worker:
      enabled: ${FINEMP_SYNC_WORKER_ENABLED:false}
      concurrency: ${FINEMP_SYNC_WORKER_CONCURRENCY:2}
      poll-delay-ms: ${FINEMP_SYNC_POLL_DELAY_MS:5000}
      max-execution-seconds: ${FINEMP_SYNC_MAX_EXECUTION_SECONDS:900}
    retry:
      max-attempts: ${FINEMP_SYNC_MAX_ATTEMPTS:3}
      lease-seconds: ${FINEMP_SYNC_LEASE_SECONDS:300}
      initial-delay-seconds: ${FINEMP_SYNC_RETRY_INITIAL_DELAY_SECONDS:30}
      max-delay-seconds: ${FINEMP_SYNC_RETRY_MAX_DELAY_SECONDS:300}
    publication:
      max-records: ${FINEMP_SYNC_MAX_RECORDS:25000}
    executor:
      enabled: ${FINEMP_SYNC_EXECUTOR_ENABLED:false}
    control:
      enabled: ${FINEMP_SYNC_CONTROL_ENABLED:false}
      max-window-days: ${FINEMP_SYNC_MAX_WINDOW_DAYS:366}
  integration:
    questor:
      enabled: ${FINEMP_QUESTOR_ENABLED:false}
      query-timeout-seconds: ${FINEMP_QUESTOR_QUERY_TIMEOUT_SECONDS:30}
      identity:
        enabled: ${FINEMP_QUESTOR_IDENTITY_ENABLED:false}
        table: ${FINEMP_QUESTOR_IDENTITY_TABLE:}
        code-column: ${FINEMP_QUESTOR_IDENTITY_CODE_COLUMN:}
        cnpj-column: ${FINEMP_QUESTOR_IDENTITY_CNPJ_COLUMN:}
      jdbc-url: ${FINEMP_QUESTOR_JDBC_URL:}
      username: ${FINEMP_QUESTOR_USERNAME:}
      password: ${FINEMP_QUESTOR_PASSWORD:}
    
