spring:
  application:
    name: finemp-api

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

finemp:
  integration:
    questor:
      enabled: ${FINEMP_QUESTOR_ENABLED:false}
      jdbc-url: ${FINEMP_QUESTOR_JDBC_URL:}
      username: ${FINEMP_QUESTOR_USERNAME:}
      password: ${FINEMP_QUESTOR_PASSWORD:}
      encoding: ${FINEMP_QUESTOR_ENCODING:NONE}
      char-set: ${FINEMP_QUESTOR_CHARSET:windows-1252}